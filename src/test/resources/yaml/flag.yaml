version: 1

particles:
  grid:
    name: cloth
    rows: 8
    cols: 14
    spacing: 0.15
    mass: 0.005
    edge_groups:
      - edge: left
        group: pole

forces:
  - gravity:
      group: cloth
      acceleration: [0.0, -9.8, 0.0]
  - wind:
      grid: cloth
      velocity: "[6.0 + 2.0*sin(t*0.7), 0.3*sin(t*1.3), 0.8*cos(t*0.9)]"
      density: 1.2
  - mesh_springs:
      grid: cloth
      edges: structural
      stiffness: 200.0
      damping: 1.0
  - mesh_springs:
      grid: cloth
      edges: shear
      stiffness: 100.0
      damping: 0.5
  - mesh_springs:
      grid: cloth
      edges: bend
      stiffness: 20.0
      damping: 0.2

constraints:
  - fixed_position:
      group: pole
      at_current_positions: true
