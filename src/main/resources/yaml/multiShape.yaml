# Matches particlesim.debug.MultiShapeScene: a flagpole, a flag planted at its top, a tire, and
# a dropped ball, composed via §4.5's shape registry (particlesim.yaml.ShapeRegistry) - each
# shape_definitions entry below is written in its own natural (unplaced) coordinates, exactly
# like buildFlagpole/buildFlag/buildTire/buildBallBounce's own defaults, and the `shapes:`
# section places/instances each the same way MultiShapeScene itself does (poleHeight=3.5,
# flag at offset [0, poleHeight, 0], tire at offset [3, 0, 0], ball at offset [-2.5, 0, 1.5]
# with dropHeight=4.0 baked into the ball shape body, not the offset).
#
# Unlike flagOnRope.yaml, flagShape below keeps its own fixed_position pole-anchor constraint
# (buildFlag's own default) - MultiShapeScene forwards flag.constraints unchanged, since this
# flag is visually planted at the flagpole's top but not physically attached to it (see
# buildFlagpole's own doc comment: "purely a visual/structural anchor... aren't physically
# connected"). Don't "fix" this to match flagOnRope's dropped-constraint pattern - the two
# scenes are deliberately different here.
version: 1

shape_definitions:
  - name: flagpoleShape
    body:
      particles:
        - list:
            name: pole
            particles:
              - { position: [0.0, 0.0, 0.0] }
              - { position: [0.0, 0.5833333, 0.0] }
              - { position: [0.0, 1.1666667, 0.0] }
              - { position: [0.0, 1.75, 0.0] }
              - { position: [0.0, 2.3333333, 0.0] }
              - { position: [0.0, 2.9166667, 0.0] }
              - { position: [0.0, 3.5, 0.0] }
      constraints:
        - fixed_position: { group: pole, at_current_positions: true }

  - name: flagShape
    body:
      particles:
        - grid:
            name: cloth
            rows: 8
            cols: 14
            spacing: 0.15
            mass: 0.005
            edge_groups:
              - { edge: left, group: pole }
      forces:
        - gravity: { group: cloth, acceleration: [0.0, -9.8, 0.0] }
        - wind:
            grid: cloth
            velocity: "[6.0 + 2.0*sin(t*0.7), 0.3*sin(t*1.3), 0.8*cos(t*0.9)]"
            density: 1.2
        - mesh_springs: { grid: cloth, edges: structural, stiffness: 200.0, damping: 1.0 }
        - mesh_springs: { grid: cloth, edges: shear, stiffness: 100.0, damping: 0.5 }
        - mesh_springs: { grid: cloth, edges: bend, stiffness: 20.0, damping: 0.2 }
      constraints:
        - fixed_position: { group: pole, at_current_positions: true }

  - name: tireShape
    body:
      particles:
        - list:
            name: rim
            particles:
              - { id: rim0, position: [1.000000, 3.0, 0.000000], mass: 0.02, radius: 0.05 }
              - { id: rim1, position: [0.923880, 3.0, 0.382683], mass: 0.02, radius: 0.05 }
              - { id: rim2, position: [0.707107, 3.0, 0.707107], mass: 0.02, radius: 0.05 }
              - { id: rim3, position: [0.382683, 3.0, 0.923880], mass: 0.02, radius: 0.05 }
              - { id: rim4, position: [0.000000, 3.0, 1.000000], mass: 0.02, radius: 0.05 }
              - { id: rim5, position: [-0.382683, 3.0, 0.923880], mass: 0.02, radius: 0.05 }
              - { id: rim6, position: [-0.707107, 3.0, 0.707107], mass: 0.02, radius: 0.05 }
              - { id: rim7, position: [-0.923880, 3.0, 0.382683], mass: 0.02, radius: 0.05 }
              - { id: rim8, position: [-1.000000, 3.0, 0.000000], mass: 0.02, radius: 0.05 }
              - { id: rim9, position: [-0.923880, 3.0, -0.382683], mass: 0.02, radius: 0.05 }
              - { id: rim10, position: [-0.707107, 3.0, -0.707107], mass: 0.02, radius: 0.05 }
              - { id: rim11, position: [-0.382683, 3.0, -0.923880], mass: 0.02, radius: 0.05 }
              - { id: rim12, position: [0.000000, 3.0, -1.000000], mass: 0.02, radius: 0.05 }
              - { id: rim13, position: [0.382683, 3.0, -0.923880], mass: 0.02, radius: 0.05 }
              - { id: rim14, position: [0.707107, 3.0, -0.707107], mass: 0.02, radius: 0.05 }
              - { id: rim15, position: [0.923880, 3.0, -0.382683], mass: 0.02, radius: 0.05 }
      forces:
        - gravity: { group: rim, acceleration: [0.0, -9.8, 0.0] }
        - spring:
            pairs: [[rim0, rim1], [rim1, rim2], [rim2, rim3], [rim3, rim4], [rim4, rim5], [rim5, rim6], [rim6, rim7],
                    [rim7, rim8], [rim8, rim9], [rim9, rim10], [rim10, rim11], [rim11, rim12], [rim12, rim13],
                    [rim13, rim14], [rim14, rim15], [rim15, rim0]]
            rest_length: 0.390181
            stiffness: 300.0
            name: rim-spring
        - damper:
            pairs: [[rim0, rim1], [rim1, rim2], [rim2, rim3], [rim3, rim4], [rim4, rim5], [rim5, rim6], [rim6, rim7],
                    [rim7, rim8], [rim8, rim9], [rim9, rim10], [rim10, rim11], [rim11, rim12], [rim12, rim13],
                    [rim13, rim14], [rim14, rim15], [rim15, rim0]]
            damping: 2.0
            name: rim-damper
        - spring:
            pairs: [[rim0, rim8], [rim1, rim9], [rim2, rim10], [rim3, rim11], [rim4, rim12], [rim5, rim13], [rim6, rim14], [rim7, rim15]]
            rest_length: 2.0
            stiffness: 40.0
            name: diameter-spring
        - damper:
            pairs: [[rim0, rim8], [rim1, rim9], [rim2, rim10], [rim3, rim11], [rim4, rim12], [rim5, rim13], [rim6, rim14], [rim7, rim15]]
            damping: 1.0
            name: diameter-damper
      colliders:
        - plane: { name: floor, position: [0.0, 0.0, 0.0], normal: [0.0, 1.0, 0.0] }
      collisions:
        rules:
          - particle_collider:
              group: rim
              collider: floor
              restitution: 0.4
              compression_damping: 2.0
              extension_damping: 0.3

  - name: ballShape
    body:
      particles:
        - single: { name: ball, position: [0.0, 4.0, 0.0], mass: 1.0, radius: 0.2 }
      colliders:
        - plane: { name: floor, position: [0.0, 0.0, 0.0], normal: [0.0, 1.0, 0.0] }
      forces:
        - gravity: { group: ball, acceleration: [0.0, -9.8, 0.0] }
      collisions:
        rules:
          - particle_collider:
              group: ball
              collider: floor
              restitution: 0.7
              compression_damping: 3.0
              extension_damping: 0.2

shapes:
  - use: flagpoleShape
    instance: pole
  - use: flagShape
    instance: flag
    offset: [0.0, 3.5, 0.0]
  - use: tireShape
    instance: tire
    offset: [3.0, 0.0, 0.0]
  - use: ballShape
    instance: ball
    offset: [-2.5, 0.0, 1.5]
