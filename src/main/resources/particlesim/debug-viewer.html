<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ParticleSim — debug viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  #status {
    position: fixed; top: 8px; left: 8px; z-index: 1;
    font: 12px/1.4 monospace; color: #9f9; background: rgba(0,0,0,0.5);
    padding: 4px 8px; border-radius: 4px;
  }
  #returnToScripted {
    position: fixed; top: 8px; right: 8px; z-index: 1;
    font: 12px/1.4 monospace; color: #fff; background: rgba(50,90,160,0.85);
    padding: 6px 10px; border-radius: 4px; border: none; cursor: pointer;
    display: none;
  }
  #meshEdgesToggle {
    position: fixed; top: 44px; right: 8px; z-index: 1;
    font: 12px/1.4 monospace; color: #fff; background: rgba(0,0,0,0.5);
    padding: 4px 8px; border-radius: 4px; display: none; align-items: center; gap: 6px;
  }
  #controlPanel {
    position: fixed; bottom: 8px; left: 8px; z-index: 1;
    font: 12px/1.5 monospace; color: #ddd; background: rgba(0,0,0,0.55);
    padding: 8px 10px; border-radius: 4px; min-width: 170px;
  }
  #controlPanel h4 {
    margin: 0 0 4px; font-size: 10px; color: #9cf; font-weight: normal;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  #controlPanel section { margin-bottom: 10px; }
  #controlPanel section:last-child { margin-bottom: 0; }
  #statsPanel { white-space: pre; color: #9f9; }
  #bookmarkList { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
  #bookmarkList .bookmarkRow { display: flex; gap: 4px; align-items: center; }
  #bookmarkList button, #bookmarkForm button {
    font: 11px monospace; cursor: pointer; background: rgba(255,255,255,0.1);
    color: #ddd; border: 1px solid rgba(255,255,255,0.25); border-radius: 3px;
  }
  #bookmarkList .goBtn { flex: 1; text-align: left; padding: 2px 4px; }
  #bookmarkForm { display: flex; gap: 4px; }
  #bookmarkNameInput {
    width: 90px; font: 11px monospace; background: rgba(255,255,255,0.1);
    color: #ddd; border: 1px solid rgba(255,255,255,0.25); border-radius: 3px;
  }
  #leftPanel {
    position: fixed; top: 44px; left: 8px; z-index: 1;
    font: 12px/1.5 monospace; color: #ddd;
    max-height: calc(100vh - 52px); overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px;
  }
  #outliner, #objectPanel {
    background: rgba(0,0,0,0.55); padding: 8px 10px; border-radius: 4px; max-width: 220px;
  }
  #outliner h4, #objectPanel h4 {
    margin: 8px 0 2px; font-size: 10px; color: #9cf; font-weight: normal;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  #outliner h4:first-child { margin-top: 0; }
  #outliner ul { margin: 0 0 4px; padding: 0; list-style: none; }
  #outliner li {
    padding: 1px 3px; color: #ddd; overflow-wrap: break-word; cursor: pointer; border-radius: 2px;
  }
  #outliner li:hover { background: rgba(255,255,255,0.12); }
  #outliner li.selected { background: rgba(80,140,220,0.4); color: #fff; }
  #outliner .outlinerEmpty { color: #666; font-style: italic; padding: 1px 3px; }
  #objectPanel { display: none; }
  #objectPanel h4:first-child { margin-top: 0; }
  #objectPanelTitle { color: #fff; font-weight: bold; margin-bottom: 4px; overflow-wrap: break-word; }
  #objectPanel label { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
  #objectPanel .noRenderer { color: #888; font-style: italic; }
  #objectPanel .objectInfo { color: #9f9; margin-top: 2px; }
  #objectPanel .objectInspect { color: #9cf; margin-top: 2px; white-space: pre-line; }
  #colorLegend {
    position: fixed; bottom: 8px; right: 8px; z-index: 1;
    font: 12px/1.5 monospace; color: #ddd; background: rgba(0,0,0,0.55);
    padding: 8px 10px; border-radius: 4px; display: none;
  }
  #colorLegend h4 {
    margin: 0 0 5px; font-size: 10px; color: #9cf; font-weight: normal;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  /* Matches particlesim.render.ColorRamp.blueOrange's Okabe-Ito palette exactly (0,114,178) ->
     (230,159,0) - a visual constant, not derived from live data, so it's fine to hardcode here
     rather than compute it in JS from values that never change at runtime. */
  #colorLegendBar {
    width: 160px; height: 10px; border-radius: 3px;
    background: linear-gradient(to right, rgb(0,114,178), rgb(230,159,0));
  }
  #colorLegendLabels { display: flex; justify-content: space-between; font-size: 10px; margin-top: 3px; color: #bbb; }
</style>
</head>
<body>
<div id="status">connecting…</div>
<button id="returnToScripted">return to scripted camera</button>
<label id="meshEdgesToggle"><input type="checkbox" id="meshEdgesCheckbox"> show mesh edges</label>
<div id="leftPanel">
  <div id="outliner">
    <h4>groups</h4>
    <div id="outlinerGroups"></div>
    <h4>forces</h4>
    <div id="outlinerForces"></div>
    <h4>constraints</h4>
    <div id="outlinerConstraints"></div>
    <h4>surfaces</h4>
    <div id="outlinerSurfaces"></div>
  </div>
  <div id="objectPanel">
    <div id="objectPanelTitle"></div>
    <div id="objectPanelBody"></div>
  </div>
</div>
<div id="controlPanel">
  <section>
    <h4>display</h4>
    <label><input type="checkbox" id="gridToggle" checked> grid</label><br>
    <label><input type="checkbox" id="axesToggle" checked> axes</label>
  </section>
  <section>
    <h4>stats</h4>
    <div id="statsPanel">–</div>
  </section>
  <section>
    <h4>camera bookmarks</h4>
    <div id="bookmarkList"></div>
    <div id="bookmarkForm">
      <input type="text" id="bookmarkNameInput" placeholder="name" maxlength="20">
      <button id="saveBookmarkBtn">save</button>
    </div>
  </section>
</div>
<div id="colorLegend">
  <h4>break proximity</h4>
  <div id="colorLegendBar"></div>
  <div id="colorLegendLabels"><span>0 · at rest</span><span>1 · about to break</span></div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const statusEl = document.getElementById("status");
const returnToScriptedEl = document.getElementById("returnToScripted");
const meshEdgesToggleEl = document.getElementById("meshEdgesToggle");
const meshEdgesCheckboxEl = document.getElementById("meshEdgesCheckbox");
let showMeshEdges = false;
meshEdgesCheckboxEl.addEventListener("change", () => {
  showMeshEdges = meshEdgesCheckboxEl.checked;
  // Doesn't touch overlay.visible directly - applyFrame is this value's single writer, since it
  // also has to factor in a per-surface hiddenSurfaces toggle (§10.3) that this listener has no
  // way to know about. The next frame (at most ~16ms away) picks the new showMeshEdges value up.
});

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(6, 4, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// +Y up, right-handed (§11) — matches three.js's own default convention, so no axis remap.
// Named (not anonymous) so §10.3's global toggles can flip .visible on them directly.
const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
scene.add(gridHelper);
const axesHelper = new THREE.AxesHelper(1);
scene.add(axesHelper);

document.getElementById("gridToggle").addEventListener("change", (e) => { gridHelper.visible = e.target.checked; });
document.getElementById("axesToggle").addEventListener("change", (e) => { axesHelper.visible = e.target.checked; });

// Lighting for §10.2's shaded surface meshes — MeshBasicMaterial (dots, wireframe meshes)
// doesn't need this, but a solid MeshStandardMaterial surface would render pure black without it.
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
sunLight.position.set(5, 10, 7);
scene.add(sunLight);

// --- Camera: scripted (engine-evaluated, §10.1) vs. manual (viewer-local orbit) -----------
// Both drive the *same* camera object; only one writes to it on any given frame, decided by
// cameraMode, so they never fight each other. OrbitControls stays enabled at all times so its
// own pointer/wheel listeners can detect "the user just grabbed the viewport" via its "start"
// event even while scripted mode has been driving the camera up to that point — but its
// internal state is only ever *applied* to the camera (via controls.update()) while in manual
// mode, and applyFrame only ever writes the server's camera pose while in scripted mode.
const controls = new OrbitControls(camera, renderer.domElement);
let cameraMode = "scripted";
let lastScriptedLookAt = new THREE.Vector3(0, 0, 0);

function enterManualCamera() {
  if (cameraMode === "manual") return;
  cameraMode = "manual";
  controls.target.copy(lastScriptedLookAt);
  returnToScriptedEl.style.display = "block";
}
controls.addEventListener("start", enterManualCamera);
returnToScriptedEl.addEventListener("click", () => {
  cameraMode = "scripted";
  returnToScriptedEl.style.display = "none";
});

// --- Camera bookmarks (§10.3) -------------------------------------------------------------
// Session-only (in-memory), not persisted across a page reload — nothing in §10.3 asks for
// cross-session persistence, and viewer state today is generally ephemeral (mesh-edges toggle,
// global display toggles above are the same). Restoring a bookmark must switch into manual mode
// first: applyFrame only ever writes the scripted pose while cameraMode is "scripted" (see
// above), so setting the camera here while still scripted would just get overwritten by the
// very next frame.
const bookmarkListEl = document.getElementById("bookmarkList");
const bookmarkNameInputEl = document.getElementById("bookmarkNameInput");
const bookmarks = new Map(); // name -> { position: THREE.Vector3, target: THREE.Vector3 }

function goToBookmark(name) {
  const bookmark = bookmarks.get(name);
  if (!bookmark) return;
  enterManualCamera(); // may set controls.target to lastScriptedLookAt - overwritten right below
  camera.position.copy(bookmark.position);
  controls.target.copy(bookmark.target);
  controls.update();
}

function renderBookmarkList() {
  bookmarkListEl.innerHTML = "";
  for (const name of bookmarks.keys()) {
    const row = document.createElement("div");
    row.className = "bookmarkRow";
    const goBtn = document.createElement("button");
    goBtn.className = "goBtn";
    goBtn.textContent = name;
    goBtn.addEventListener("click", () => goToBookmark(name));
    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "×";
    deleteBtn.title = `remove "${name}"`;
    deleteBtn.addEventListener("click", () => { bookmarks.delete(name); renderBookmarkList(); });
    row.append(goBtn, deleteBtn);
    bookmarkListEl.appendChild(row);
  }
}

document.getElementById("saveBookmarkBtn").addEventListener("click", () => {
  const name = bookmarkNameInputEl.value.trim();
  if (!name) return;
  bookmarks.set(name, { position: camera.position.clone(), target: controls.target.clone() });
  bookmarkNameInputEl.value = "";
  renderBookmarkList();
});
bookmarkNameInputEl.addEventListener("keydown", (event) => {
  if (event.key === "Enter") document.getElementById("saveBookmarkBtn").click();
});

// Every particle as a dot by default (§10.2 --render-all); a particle with a declared sphere
// radius is the *same* dot mesh just scaled up (spheres are what dots already are, geometrically),
// and a particle listed in a frame's visibleIds-exclusion is skipped entirely — see applyFrame.
const BASE_DOT_RADIUS = 0.06;
const dotGeometry = new THREE.SphereGeometry(BASE_DOT_RADIUS, 8, 6);
const dotMaterial = new THREE.MeshBasicMaterial({ color: 0xffcc33 });
const draggedDotMaterial = new THREE.MeshBasicMaterial({ color: 0xff4444 });
let dots = new THREE.Group();
scene.add(dots);

// vertexColors so each connection can carry its own §10.2 breakProximity-mapped color
// (or the server's default line blue when nothing overrides it) instead of one uniform color.
const lineMaterial = new THREE.LineBasicMaterial({ vertexColors: true });
let lines = new THREE.LineSegments(new THREE.BufferGeometry(), lineMaterial);

// --- Color legend (§10.3) -----------------------------------------------------------------
// "Whenever a colorBy gradient is active anywhere in the scene" - there's no explicit per-
// connection tag on the wire saying *which* colorBy produced a color (BinaryFrame's connections
// just carry a resolved r,g,b), so activity is detected the same way a person would notice it:
// any connection whose color isn't the uncolored default. That's a sound heuristic today because
// exactly one colorBy variant exists (BREAK_PROXIMITY, §10.2) - if a second one is ever added,
// this needs to become variant-aware (which gradient, which two labels) rather than assuming
// "not the default color" always means breakProximity specifically.
const colorLegendEl = document.getElementById("colorLegend");
const DEFAULT_LINE_COLOR = { r: 0x33 / 255, g: 0x88 / 255, b: 0xff / 255 }; // mirrors Color.DEFAULT_LINE

function isDefaultLineColor(color) {
  return color.r === DEFAULT_LINE_COLOR.r && color.g === DEFAULT_LINE_COLOR.g && color.b === DEFAULT_LINE_COLOR.b;
}

function updateColorLegend(frame) {
  const active = frame.connections.some((c) => !isDefaultLineColor(c.color));
  colorLegendEl.style.display = active ? "block" : "none";
}
scene.add(lines);

// §10.2 surface meshes (shaded solid or wireframe) and arrow-sampled field forces — pooled
// like dots/lines, grown/shrunk to match each frame's declared count rather than rebuilt from
// scratch every frame.
//
// polygonOffset on the solid material pushes its depth values slightly back so anything
// coplanar with it (the structural-spring lines, and the optional edge overlay below) renders
// cleanly on top instead of z-fighting — without it, a solid mesh sharing exact vertex
// positions with a LineSegments object flickers unpredictably as the camera or the mesh's own
// shape changes, which got a lot more visible once dragging could deform the surface unevenly.
const solidMeshMaterial = () => new THREE.MeshStandardMaterial({
  color: 0x3388ff, side: THREE.DoubleSide, roughness: 0.85,
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
});
const wireframeMeshMaterial = () => new THREE.MeshBasicMaterial({ color: 0x3388ff, wireframe: true });
let meshObjects = []; // THREE.Mesh[], each carrying userData.triangleVertexIds for picking
let meshGroup = new THREE.Group();
scene.add(meshGroup);

// A viewer-local "show mesh edges" toggle, independent of the server's own per-mesh wireframe
// flag (which chooses solid-vs-wireframe-only rendering) — this overlays a wireframe on top of
// an otherwise-solid mesh, the usual way to let someone see the triangulation without losing
// the shading. Uses the same edges every frame's geometry has, so it's just as pooled/rebuilt.
const edgeOverlayMaterial = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 });
let meshEdgeOverlays = []; // THREE.LineSegments[], one per mesh, parallel to meshObjects

const ARROW_COLOR = 0xffaa33;
let arrowObjects = []; // THREE.ArrowHelper[]
let arrowGroup = new THREE.Group();
scene.add(arrowGroup);

let latestStep = 0;

// Builds one mesh's geometry with *shared* (indexed) vertices, not one unconnected triangle
// per face — so computeVertexNormals() averages normals across adjacent faces for smooth
// shading, rather than every triangle getting its own flat facet. Returns null (skip this
// mesh entirely this frame) if any referenced particle isn't in the current frame.
function buildMeshGeometry(meshDecl, byId) {
  const localIndexOf = new Map();
  const positions = [];
  const indices = [];
  const triangleVertexIds = [];
  for (const tri of meshDecl.triangles) {
    const a = byId.get(tri.a), b = byId.get(tri.b), c = byId.get(tri.c);
    if (!a || !b || !c) continue; // an endpoint isn't alive this frame - omit, don't zero-fill
    for (const [id, p] of [[tri.a, a], [tri.b, b], [tri.c, c]]) {
      if (!localIndexOf.has(id)) {
        localIndexOf.set(id, positions.length / 3);
        positions.push(p.x, p.y, p.z);
      }
    }
    indices.push(localIndexOf.get(tri.a), localIndexOf.get(tri.b), localIndexOf.get(tri.c));
    triangleVertexIds.push([tri.a, tri.b, tri.c]);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(positions), 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return { geometry, triangleVertexIds };
}

function applyFrame(frame) {
  latestStep = frame.step;

  // §10.1's scripted camera: engine-evaluated, so applying it here is just "set the numbers
  // we were sent" — no expression/lambda evaluation needed client-side. Omitted entirely by
  // demos with no scripted camera, in which case the viewer's static default (set once,
  // above) is left untouched. Suppressed entirely once the viewer has switched to manual mode.
  if (frame.camera) {
    lastScriptedLookAt.set(frame.camera.lookAt.x, frame.camera.lookAt.y, frame.camera.lookAt.z);
    if (cameraMode === "scripted") {
      const c = frame.camera;
      camera.position.set(c.position.x, c.position.y, c.position.z);
      camera.up.set(c.up.x, c.up.y, c.up.z);
      camera.lookAt(c.lookAt.x, c.lookAt.y, c.lookAt.z);
    }
  }

  const byId = new Map();
  frame.particles.forEach((p) => byId.set(p.id, p));
  const sphereRadii = new Map(frame.spheres.map((s) => [s.id, s.radius]));
  latestVisibleIds = frame.visibleIds;
  latestById = byId;
  latestMeshes = frame.meshes;
  // null (the default, every pre-existing demo) = every particle gets a dot; otherwise only
  // the listed ids do — §10.2's "the individual cloth particles have no renderer of their own".
  const serverVisible = frame.visibleIds ? frame.particles.filter((p) => frame.visibleIds.has(p.id)) : frame.particles;
  // §10.3's group visibility toggle: a particle is hidden if it belongs to any group a person
  // has unchecked in the per-object panel, layered on top of (not instead of) the server's own
  // decision above - see hiddenGroups' own doc comment for why that order matters.
  const hiddenParticleIds = new Set();
  for (const group of frame.registry.groups) {
    if (hiddenGroups.has(group.name)) {
      for (const id of group.memberIds) hiddenParticleIds.add(id);
    }
  }
  const visible = hiddenParticleIds.size === 0 ? serverVisible : serverVisible.filter((p) => !hiddenParticleIds.has(p.id));

  while (dots.children.length < visible.length) {
    dots.add(new THREE.Mesh(dotGeometry, dotMaterial));
  }
  while (dots.children.length > visible.length) {
    dots.remove(dots.children[dots.children.length - 1]);
  }
  visible.forEach((p, i) => {
    const dot = dots.children[i];
    dot.position.set(p.x, p.y, p.z);
    dot.userData.particleId = p.id;
    dot.material = p.id === draggedParticleId ? draggedDotMaterial : dotMaterial;
    const radius = sphereRadii.get(p.id);
    const scale = radius ? radius / BASE_DOT_RADIUS : 1;
    dot.scale.setScalar(scale);
  });

  // Resolve+filter before allocating: a connection whose endpoint id isn't in this frame
  // (possible once Phase 6 destroys particles mid-run) must not leave a stale zeroed segment
  // in the buffer — that would draw a spurious line from the origin instead of just omitting it.
  const segments = frame.connections
    .map((c) => [byId.get(c.a), byId.get(c.b), c.color])
    .filter(([a, b]) => a && b);
  const positions = new Float32Array(segments.length * 6);
  const colors = new Float32Array(segments.length * 6);
  segments.forEach(([a, b, color], i) => {
    positions.set([a.x, a.y, a.z, b.x, b.y, b.z], i * 6);
    colors.set([color.r, color.g, color.b, color.r, color.g, color.b], i * 6);
  });
  lines.geometry.dispose();
  lines.geometry = new THREE.BufferGeometry();
  lines.geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  lines.geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  updateColorLegend(frame);

  // Surface meshes (§10.2): rebuilt every frame (positions move every step) but the pool of
  // THREE.Mesh objects itself is grown/shrunk, not recreated, matching the dots/lines pattern.
  while (meshObjects.length < frame.meshes.length) {
    const obj = new THREE.Mesh(new THREE.BufferGeometry(), solidMeshMaterial());
    meshGroup.add(obj);
    meshObjects.push(obj);
    const overlay = new THREE.LineSegments(new THREE.BufferGeometry(), edgeOverlayMaterial);
    overlay.visible = showMeshEdges;
    meshGroup.add(overlay);
    meshEdgeOverlays.push(overlay);
  }
  while (meshObjects.length > frame.meshes.length) {
    meshGroup.remove(meshObjects.pop());
    meshGroup.remove(meshEdgeOverlays.pop());
  }
  meshEdgesToggleEl.style.display = frame.meshes.length > 0 ? "flex" : "none";
  frame.meshes.forEach((meshDecl, i) => {
    const obj = meshObjects[i];
    obj.geometry.dispose();
    const built = buildMeshGeometry(meshDecl, byId);
    obj.geometry = built.geometry;
    obj.userData.triangleVertexIds = built.triangleVertexIds;
    obj.userData.surfaceName = meshDecl.name; // "" when unnamed - right-click resolves this to a panel
    obj.material = meshDecl.wireframe ? wireframeMeshMaterial() : solidMeshMaterial();

    const overlay = meshEdgeOverlays[i];
    overlay.geometry.dispose();
    overlay.geometry = new THREE.WireframeGeometry(built.geometry);

    // §10.3's surface visibility toggle: meshDecl.name is "" for an unnamed Surface, which never
    // matches anything in hiddenSurfaces (nothing unnamed is reachable in the outliner to hide
    // it with), so this is a no-op for every mesh that existed before this feature.
    const hiddenByToggle = meshDecl.name !== "" && hiddenSurfaces.has(meshDecl.name);
    obj.visible = !hiddenByToggle;
    overlay.visible = !hiddenByToggle && showMeshEdges;
  });

  // Arrow-sampled field forces (§10.2): one ArrowHelper per sample, pooled the same way.
  while (arrowObjects.length < frame.arrows.length) {
    const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 1, ARROW_COLOR);
    arrowGroup.add(arrow);
    arrowObjects.push(arrow);
  }
  while (arrowObjects.length > frame.arrows.length) {
    arrowGroup.remove(arrowObjects.pop());
  }
  frame.arrows.forEach((sample, i) => {
    const arrow = arrowObjects[i];
    const dir = new THREE.Vector3(sample.vector.x, sample.vector.y, sample.vector.z);
    const length = dir.length();
    arrow.position.set(sample.origin.x, sample.origin.y, sample.origin.z);
    if (length > 1e-9) {
      arrow.setDirection(dir.normalize());
      // Head sized as a modest fraction of the shaft, capped small in absolute terms too -
      // the previous 0.3/0.15 caps were close to a third of a typical arrow's own length,
      // reading as an oversized arrowhead rather than a thin shaft with a point.
      arrow.setLength(length, Math.min(0.12, length * 0.2), Math.min(0.06, length * 0.1));
      arrow.visible = true;
    } else {
      arrow.visible = false; // a zero-length arrow has no defined direction to draw
    }
  });

  updateGroupPanelInfo(); // text-only refresh - see its own doc comment for why it never touches the checkbox
  updateInspection(); // same text-only discipline, for the live position/velocity/speed readout
}

// --- Binary frame decoding (§9.1) ---------------------------------------------------------
// Mirrors particlesim.debug.BinaryFrame's layout exactly (little-endian throughout) - see
// that class's own doc comment for the full field-by-field layout.
const utf8Decoder = new TextDecoder("utf-8");

function decodeFrame(buffer) {
  const view = new DataView(buffer);
  let offset = 0;
  const readVec = () => {
    const x = view.getFloat64(offset, true); offset += 8;
    const y = view.getFloat64(offset, true); offset += 8;
    const z = view.getFloat64(offset, true); offset += 8;
    return { x, y, z };
  };
  const readString = () => {
    const len = view.getInt32(offset, true); offset += 4;
    const str = utf8Decoder.decode(new Uint8Array(buffer, offset, len));
    offset += len;
    return str;
  };
  const readNameList = () => {
    const count = view.getInt32(offset, true); offset += 4;
    const names = new Array(count);
    for (let i = 0; i < count; i++) names[i] = readString();
    return names;
  };
  const readGroupList = () => {
    const count = view.getInt32(offset, true); offset += 4;
    const groups = new Array(count);
    for (let i = 0; i < count; i++) {
      const name = readString();
      const memberCount = view.getInt32(offset, true); offset += 4;
      const memberIds = new Set();
      for (let j = 0; j < memberCount; j++) { memberIds.add(view.getInt32(offset, true)); offset += 4; }
      groups[i] = { name, memberIds };
    }
    return groups;
  };

  const t = view.getFloat64(offset, true); offset += 8;
  const step = Number(view.getBigInt64(offset, true)); offset += 8;
  const particleCount = view.getInt32(offset, true); offset += 4;
  const particles = new Array(particleCount);
  for (let i = 0; i < particleCount; i++) {
    const id = view.getInt32(offset, true); offset += 4;
    const x = view.getFloat64(offset, true); offset += 8;
    const y = view.getFloat64(offset, true); offset += 8;
    const z = view.getFloat64(offset, true); offset += 8;
    const vx = view.getFloat64(offset, true); offset += 8;
    const vy = view.getFloat64(offset, true); offset += 8;
    const vz = view.getFloat64(offset, true); offset += 8;
    particles[i] = { id, x, y, z, vx, vy, vz };
  }
  const connectionCount = view.getInt32(offset, true); offset += 4;
  const connections = new Array(connectionCount);
  for (let i = 0; i < connectionCount; i++) {
    const a = view.getInt32(offset, true); offset += 4;
    const b = view.getInt32(offset, true); offset += 4;
    const r = view.getFloat64(offset, true); offset += 8;
    const g = view.getFloat64(offset, true); offset += 8;
    const bl = view.getFloat64(offset, true); offset += 8;
    connections[i] = { a, b, color: { r, g, b: bl } };
  }
  const hasCamera = view.getUint8(offset); offset += 1;
  const cam = hasCamera ? { position: readVec(), lookAt: readVec(), up: readVec() } : null;

  const sphereCount = view.getInt32(offset, true); offset += 4;
  const spheres = new Array(sphereCount);
  for (let i = 0; i < sphereCount; i++) {
    const id = view.getInt32(offset, true); offset += 4;
    const radius = view.getFloat64(offset, true); offset += 8;
    spheres[i] = { id, radius };
  }

  const meshCount = view.getInt32(offset, true); offset += 4;
  const meshes = new Array(meshCount);
  for (let i = 0; i < meshCount; i++) {
    const wireframe = view.getUint8(offset) !== 0; offset += 1;
    const name = readString(); // "" when the mesh's Surface is unnamed - never matches an outliner entry
    const triangleCount = view.getInt32(offset, true); offset += 4;
    const triangles = new Array(triangleCount);
    for (let j = 0; j < triangleCount; j++) {
      const a = view.getInt32(offset, true); offset += 4;
      const b = view.getInt32(offset, true); offset += 4;
      const c = view.getInt32(offset, true); offset += 4;
      triangles[j] = { a, b, c };
    }
    meshes[i] = { wireframe, name, triangles };
  }

  const arrowCount = view.getInt32(offset, true); offset += 4;
  const arrows = new Array(arrowCount);
  for (let i = 0; i < arrowCount; i++) {
    arrows[i] = { origin: readVec(), vector: readVec() };
  }

  const hasVisibleIds = view.getUint8(offset) !== 0; offset += 1;
  let visibleIds = null;
  if (hasVisibleIds) {
    const visibleCount = view.getInt32(offset, true); offset += 4;
    visibleIds = new Set();
    for (let i = 0; i < visibleCount; i++) {
      visibleIds.add(view.getInt32(offset, true)); offset += 4;
    }
  }

  // §10.3's outliner data (SceneRegistry) - name lists for forces/constraints/surfaces, plus
  // current member ids for groups (needed for the group visibility toggle - see applyFrame's
  // hiddenGroups handling). Sent unconditionally, so a demo with nothing named just yields empty
  // arrays here, not a missing field.
  const registry = {
    forces: readNameList(),
    constraints: readNameList(),
    surfaces: readNameList(),
    groups: readGroupList(),
  };

  return { t, step, particles, connections, camera: cam, spheres, meshes, arrows, visibleIds, registry };
}

// --- Stats overlay (§10.3) ----------------------------------------------------------------
// Particle count is a direct frame readout; step rate and lag both need a wall-clock anchor,
// reset on every fresh connection (not just once ever) so reconnecting to a *different* demo
// process - whose own `t`/`step` restart near zero - doesn't compare against a stale baseline
// from the previous process and report a nonsensical lag/rate forever.
const statsPanelEl = document.getElementById("statsPanel");
let statsAnchorWallMs = null;
let statsAnchorT = null;
let statsRateSampleWallMs = null;
let statsRateSampleStep = null;
let statsStepRate = 0;

function resetStats() {
  statsAnchorWallMs = null;
  statsAnchorT = null;
  statsRateSampleWallMs = null;
  statsRateSampleStep = null;
  statsStepRate = 0;
}

function updateStats(frame) {
  const nowMs = performance.now();
  if (statsAnchorWallMs === null) {
    statsAnchorWallMs = nowMs;
    statsAnchorT = frame.t;
    statsRateSampleWallMs = nowMs;
    statsRateSampleStep = frame.step;
  }

  // Lag (§9.1's pacing policy, made visible): drift between wall-clock elapsed and sim-time
  // elapsed since the anchor frame, not an absolute t-vs-wallclock difference - a viewer that
  // *attaches* mid-run must read ~0 lag at that moment, not "however far into the run it is."
  const wallElapsedS = (nowMs - statsAnchorWallMs) / 1000;
  const simElapsedS = frame.t - statsAnchorT;
  const lagS = wallElapsedS - simElapsedS;

  // Step rate from Δstep/Δwallclock (the engine's own step counter), sampled roughly once a
  // second - *not* frames-received-per-second, which differs from the true physics rate by
  // exactly stepsPerFrame and would misreport whenever rendered frames drop (by design, §9.1).
  const sinceSampleMs = nowMs - statsRateSampleWallMs;
  if (sinceSampleMs >= 1000) {
    statsStepRate = ((frame.step - statsRateSampleStep) / sinceSampleMs) * 1000;
    statsRateSampleWallMs = nowMs;
    statsRateSampleStep = frame.step;
  }

  statsPanelEl.textContent =
    `particles: ${frame.particles.length}\n` +
    `steps/s:   ${statsStepRate.toFixed(0)}\n` +
    `lag:       ${lagS >= 0 ? "+" : ""}${lagS.toFixed(2)}s`;
}

// --- Outliner & per-object panel (§10.3) --------------------------------------------------
// A persistent, always-available list of every named group/force/constraint/surface, regardless
// of what's currently rendered - the answer to "how do I reach an invisible object's settings."
// Selecting an entry opens a shared panel below the list (§10.3: "selecting an entry opens the
// same per-object panel a right-click would" - right-click-in-3D itself is still separate,
// unstarted future work). Visibility toggles are only *real* for groups and surfaces this pass:
// a group's members are already known (registry.groups' memberIds) and a mesh already carries
// its surface's name (BinaryFrame's mesh entries), but a force's connections/arrow samples carry
// no source tag yet, and a constraint has no renderer defined at all (§10.2) - both of those get
// an informational note instead of a checkbox that would silently do nothing.
const outlinerSections = {
  groups: document.getElementById("outlinerGroups"),
  forces: document.getElementById("outlinerForces"),
  constraints: document.getElementById("outlinerConstraints"),
  surfaces: document.getElementById("outlinerSurfaces"),
};
const objectPanelEl = document.getElementById("objectPanel");
const objectPanelTitleEl = document.getElementById("objectPanelTitle");
const objectPanelBodyEl = document.getElementById("objectPanelBody");

let lastRegistrySignature = null;
let latestRegistry = { forces: [], constraints: [], surfaces: [], groups: [] };
let selectedKind = null; // "groups" | "forces" | "constraints" | "surfaces"
let selectedName = null;
let latestVisibleIds = null; // this frame's server-side dot filter, updated every frame in applyFrame
let objectPanelInfoEl = null; // the groups panel's live "N drawable" text node, or null otherwise
let latestById = new Map(); // this frame's particles by id (position + velocity), for §10.3 inspection
let latestMeshes = []; // this frame's mesh declarations, for a selected surface's inspection readout
let objectPanelInspectEl = null; // the groups/surfaces panel's live numeric-readout text node

// Names of groups/surfaces a person has explicitly unchecked in the per-object panel. Composed
// with (never replacing) whatever the server itself already decided - e.g. FlagDebugDemo sends
// visibleIds=poleIds specifically to hide cloth dots because the mesh already shows them, and
// leaving "cloth" checked here must not repaint those 112 dots back on top of the mesh. A
// particle/mesh draws only if the server permits it *and* nothing here hides it - see applyFrame.
const hiddenGroups = new Set();
const hiddenSurfaces = new Set();

// A plain JSON.stringify(registry) can't detect a group's membership changing, since Set doesn't
// serialize meaningfully (every group would stringify to the same shape regardless of contents) -
// so member ids are flattened into a sorted array first, specifically so this check stays
// correct once something (a future emitter) actually changes group membership between frames.
function registrySignature(registry) {
  return JSON.stringify({
    forces: registry.forces,
    constraints: registry.constraints,
    surfaces: registry.surfaces,
    groups: registry.groups.map((g) => ({ name: g.name, memberIds: [...g.memberIds].sort((a, b) => a - b) })),
  });
}

function updateSelectionHighlight() {
  document.querySelectorAll("#outliner li[data-kind]").forEach((li) => {
    li.classList.toggle("selected", li.dataset.kind === selectedKind && li.dataset.name === selectedName);
  });
}

function selectObject(kind, name) {
  selectedKind = kind;
  selectedName = name;
  updateSelectionHighlight();
  renderObjectPanel();
}

// A group's member count alone doesn't explain why toggling it might do nothing visually - most
// (or all) of its members could already be excluded from dot-drawing entirely by the server's own
// visibleIds (e.g. FlagDebugDemo's cloth particles, mesh-only since the mesh already shows them).
// "N drawable right now" makes that explicit instead of leaving it to be discovered by confused
// clicking - which is exactly what motivated adding this (a real person hit this in testing).
function groupPanelInfoText(name) {
  const group = latestRegistry.groups.find((g) => g.name === name);
  if (!group) return "0 particle(s)";
  const total = group.memberIds.size;
  const drawable = latestVisibleIds ? [...group.memberIds].filter((id) => latestVisibleIds.has(id)).length : total;
  return `${total} particle(s) — ${drawable} drawable as a dot right now`;
}

// Updates only the info text node, never touching the checkbox element itself - called every
// frame (from applyFrame) so the count tracks visibleIds changes live, but recreating the
// checkbox that often would risk detaching it mid-click if a frame arrives between a person's
// mousedown and mouseup, turning an occasional click into a lost one.
function updateGroupPanelInfo() {
  if (selectedKind !== "groups" || !objectPanelInfoEl) return;
  objectPanelInfoEl.textContent = groupPanelInfoText(selectedName);
}

// --- Selection & inspection (§10.3) -------------------------------------------------------
// "Live numeric readout for it" — extended sensibly from a single particle (what the spec's own
// examples describe: "a particle's position/velocity") to a whole group or surface, since that's
// what's actually selectable today. A group's readout is its members' centroid and average
// speed; a surface's is its unique vertex count's average speed and its triangle count. Forces
// and constraints still have no live numeric data on the wire (no source-tag on connections/
// arrow samples, no per-object magnitude), so they keep the same informational note as the
// visibility-toggle gap — both are blocked on the same missing protocol piece.
function vectorLength(x, y, z) { return Math.sqrt(x * x + y * y + z * z); }

function formatVec(x, y, z) { return `(${x.toFixed(2)}, ${y.toFixed(2)}, ${z.toFixed(2)})`; }

// Updates only the inspection text node, same single-writer discipline as updateGroupPanelInfo
// and for the same reason: called every frame, but never recreates the checkbox it sits next to.
function updateInspection() {
  if (!objectPanelInspectEl) return;
  if (selectedKind === "groups") {
    const group = latestRegistry.groups.find((g) => g.name === selectedName);
    const memberIds = group ? group.memberIds : new Set();
    let sumX = 0, sumY = 0, sumZ = 0, sumSpeed = 0, count = 0;
    for (const id of memberIds) {
      const p = latestById.get(id);
      if (!p) continue; // not present this frame (e.g. destroyed - Phase 6, unbuilt, but defensive)
      sumX += p.x; sumY += p.y; sumZ += p.z;
      sumSpeed += vectorLength(p.vx, p.vy, p.vz);
      count++;
    }
    objectPanelInspectEl.textContent = count === 0
      ? "no live data"
      : `centroid: ${formatVec(sumX / count, sumY / count, sumZ / count)}\navg speed: ${(sumSpeed / count).toFixed(3)} m/s`;
  } else if (selectedKind === "surfaces") {
    const meshDecl = latestMeshes.find((m) => m.name === selectedName);
    if (!meshDecl) { objectPanelInspectEl.textContent = "no live data"; return; }
    const vertexIds = new Set();
    for (const tri of meshDecl.triangles) { vertexIds.add(tri.a); vertexIds.add(tri.b); vertexIds.add(tri.c); }
    let sumSpeed = 0, count = 0;
    for (const id of vertexIds) {
      const p = latestById.get(id);
      if (!p) continue;
      sumSpeed += vectorLength(p.vx, p.vy, p.vz);
      count++;
    }
    objectPanelInspectEl.textContent = count === 0
      ? "no live data"
      : `${meshDecl.triangles.length} triangle(s)\navg vertex speed: ${(sumSpeed / count).toFixed(3)} m/s`;
  }
}

function renderNameList(container, kind, names) {
  container.innerHTML = "";
  if (names.length === 0) {
    const empty = document.createElement("div");
    empty.className = "outlinerEmpty";
    empty.textContent = "(none)";
    container.appendChild(empty);
    return;
  }
  const list = document.createElement("ul");
  for (const name of names) {
    const item = document.createElement("li");
    item.textContent = name;
    item.dataset.kind = kind;
    item.dataset.name = name;
    item.addEventListener("click", () => selectObject(kind, name));
    list.appendChild(item);
  }
  container.appendChild(list);
}

function renderObjectPanel() {
  // The body is about to be cleared - drop stale references to nodes that won't exist anymore.
  objectPanelInfoEl = null;
  objectPanelInspectEl = null;
  if (selectedKind === null) {
    objectPanelEl.style.display = "none";
    return;
  }
  objectPanelEl.style.display = "block";
  objectPanelTitleEl.textContent = selectedName;
  objectPanelBodyEl.innerHTML = "";

  const addNote = (text) => {
    const note = document.createElement("div");
    note.className = "noRenderer";
    note.textContent = text;
    objectPanelBodyEl.appendChild(note);
  };
  const addToggle = (labelText, hiddenSet) => {
    const label = document.createElement("label");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = !hiddenSet.has(selectedName);
    checkbox.addEventListener("change", () => {
      if (checkbox.checked) hiddenSet.delete(selectedName); else hiddenSet.add(selectedName);
    });
    label.append(checkbox, document.createTextNode(" " + labelText));
    objectPanelBodyEl.appendChild(label);
  };
  const addInspect = () => {
    const inspect = document.createElement("div");
    inspect.className = "objectInspect";
    objectPanelBodyEl.appendChild(inspect);
    objectPanelInspectEl = inspect;
  };

  if (selectedKind === "groups") {
    addToggle("show particles", hiddenGroups);
    const info = document.createElement("div");
    info.className = "objectInfo";
    info.textContent = groupPanelInfoText(selectedName);
    objectPanelBodyEl.appendChild(info);
    objectPanelInfoEl = info;
    addInspect();
  } else if (selectedKind === "surfaces") {
    addToggle("show mesh", hiddenSurfaces);
    addInspect();
  } else if (selectedKind === "forces") {
    addNote("no live data available for forces yet (needs a source-tag protocol extension)");
  } else if (selectedKind === "constraints") {
    addNote("no renderer or live data defined for constraints (§10.2)");
  }
  updateInspection(); // populate immediately rather than waiting for the next frame
}

function updateOutliner(registry) {
  latestRegistry = registry;
  const signature = registrySignature(registry);
  if (signature === lastRegistrySignature) return;
  lastRegistrySignature = signature;
  renderNameList(outlinerSections.groups, "groups", registry.groups.map((g) => g.name));
  renderNameList(outlinerSections.forces, "forces", registry.forces);
  renderNameList(outlinerSections.constraints, "constraints", registry.constraints);
  renderNameList(outlinerSections.surfaces, "surfaces", registry.surfaces);
  updateSelectionHighlight();
  renderObjectPanel();
}

let socket = null;

function connect() {
  // Matches DebugRenderer's default WebSocket port; pass a different DebugRenderer(webSocketPort=)
  // and this needs to change too.
  const ws = new WebSocket(`ws://${location.hostname}:8887`);
  ws.binaryType = "arraybuffer";
  socket = ws;
  ws.onopen = () => { statusEl.textContent = "connected"; resetStats(); lastRegistrySignature = null; };
  ws.onclose = () => { statusEl.textContent = "disconnected — retrying…"; setTimeout(connect, 1000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (event) => {
    const frame = decodeFrame(event.data);
    const cameraTag = cameraMode === "manual" ? " [manual camera]" : "";
    statusEl.textContent = `t=${frame.t.toFixed(3)}  step=${frame.step}  particles=${frame.particles.length}${cameraTag}`;
    applyFrame(frame);
    updateStats(frame);
    updateOutliner(frame.registry);
  };
}
connect();

// --- Interactive drag (§9.4) --------------------------------------------------------------
// Picking is resolved entirely here — the engine never needs to know about cameras or screen
// coordinates, only the resulting 3D target position. Raycasts against both the visible dots
// *and* any surface meshes, since a particle with no dot of its own (§10.2: mesh-only
// rendering) still needs to be pickable — hitting a mesh face resolves to whichever of its
// three vertex particles is nearest the hit point. Only meaningful for a live engine attached
// over this WebSocket; a demo that doesn't wire DebugServer's onTextMessage just never
// receives these and nothing happens. Drag messages are still sent as JSON text (a separate,
// low-frequency channel from the binary per-frame stream) — see DragMessage's own doc comment.

const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const dragPlaneHit = new THREE.Vector3();
let draggedParticleId = null;

function send(message) {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
}

function pointerToNdc(event) {
  pointerNdc.set(
    (event.clientX / window.innerWidth) * 2 - 1,
    -(event.clientY / window.innerHeight) * 2 + 1,
  );
}

// Resolves a raycaster hit (against either a dot or a mesh face) to a (particleId, point) pair.
// For a mesh hit, `hit.face.{a,b,c}` are the *local* vertex indices of the hit triangle, in
// the same a/b/c order buildMeshGeometry recorded into triangleVertexIds for that same
// triangle — so pairing them positionally (not searching for a matching dot object) is exact,
// not a guess, and works even for a vertex that has no dot of its own (§10.2 mesh-only render).
function pickParticle() {
  const hits = raycaster.intersectObjects([...dots.children, ...meshObjects]);
  if (hits.length === 0) return null;
  const hit = hits[0];
  if (hit.object.userData.particleId !== undefined) {
    return { particleId: hit.object.userData.particleId, point: hit.point };
  }
  const vertexIds = hit.object.userData.triangleVertexIds?.[hit.faceIndex];
  if (!vertexIds || !hit.face) return null;
  const posAttr = hit.object.geometry.attributes.position;
  const localIndices = [hit.face.a, hit.face.b, hit.face.c];
  let nearestId = null;
  let nearestDist = Infinity;
  localIndices.forEach((localIndex, i) => {
    const vertex = new THREE.Vector3().fromBufferAttribute(posAttr, localIndex).applyMatrix4(hit.object.matrixWorld);
    const dist = vertex.distanceTo(hit.point);
    if (dist < nearestDist) { nearestDist = dist; nearestId = vertexIds[i]; }
  });
  return nearestId === null ? null : { particleId: nearestId, point: hit.point };
}

renderer.domElement.addEventListener("pointerdown", (event) => {
  pointerToNdc(event);
  raycaster.setFromCamera(pointerNdc, camera);
  const picked = pickParticle();
  if (!picked) return;

  // A drag beats an orbit — stop OrbitControls' own gesture handling for this pointer so it
  // doesn't also start panning the camera while a particle is being dragged.
  event.stopPropagation();

  draggedParticleId = picked.particleId;
  const draggedDot = dots.children.find((d) => d.userData.particleId === draggedParticleId);
  if (draggedDot) draggedDot.material = draggedDotMaterial;

  // Drag plane: through the picked point, facing the camera — the standard way to turn a 2D
  // mouse position into a 3D target without the user having to separately control depth.
  const cameraForward = new THREE.Vector3();
  camera.getWorldDirection(cameraForward);
  dragPlane.setFromNormalAndCoplanarPoint(cameraForward, picked.point);

  send({ type: "drag_start", particleId: draggedParticleId, step: latestStep, x: picked.point.x, y: picked.point.y, z: picked.point.z });
  renderer.domElement.setPointerCapture(event.pointerId);
}, { capture: true });

renderer.domElement.addEventListener("pointermove", (event) => {
  if (draggedParticleId === null) return;
  pointerToNdc(event);
  raycaster.setFromCamera(pointerNdc, camera);
  if (!raycaster.ray.intersectPlane(dragPlane, dragPlaneHit)) return;
  send({ type: "drag_move", step: latestStep, x: dragPlaneHit.x, y: dragPlaneHit.y, z: dragPlaneHit.z });
});

function endDrag(event) {
  if (draggedParticleId === null) return;
  send({ type: "drag_end", step: latestStep });
  draggedParticleId = null;
  renderer.domElement.releasePointerCapture(event.pointerId);
}
renderer.domElement.addEventListener("pointerup", endDrag);
renderer.domElement.addEventListener("pointercancel", endDrag);

// --- Right-click to open a per-object panel (§10.3) ---------------------------------------
// "The fast path for something already visible" - the outliner's click-to-select still works
// regardless, this is just a shortcut for whatever's already on screen. Reuses the same
// raycast targets as drag/pick above, but resolves differently: a mesh hit opens *that* surface's
// panel directly (unambiguous - a mesh belongs to exactly one Surface), while a dot hit opens
// the most specific *group* containing that particle, since group membership can legitimately
// overlap (a flag's pole-edge particles are members of both "cloth" and "pole") and the smaller,
// more specific group is the more likely intended target of a click on it.
renderer.domElement.addEventListener("contextmenu", (event) => {
  event.preventDefault(); // this canvas has its own right-click action; never show the browser's menu
  pointerToNdc(event);
  raycaster.setFromCamera(pointerNdc, camera);
  const hits = raycaster.intersectObjects([...dots.children, ...meshObjects]);
  if (hits.length === 0) return;
  const hit = hits[0];

  if (hit.object.userData.particleId !== undefined) {
    const particleId = hit.object.userData.particleId;
    const candidates = latestRegistry.groups.filter((g) => g.memberIds.has(particleId));
    if (candidates.length === 0) return; // not a member of any named group - nothing to open
    candidates.sort((a, b) => a.memberIds.size - b.memberIds.size);
    selectObject("groups", candidates[0].name);
    return;
  }

  const surfaceName = hit.object.userData.surfaceName;
  if (surfaceName) selectObject("surfaces", surfaceName); // "" (unnamed) has no panel to open
});

function animate() {
  requestAnimationFrame(animate);
  if (cameraMode === "manual") controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
