<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ParticleSim — debug viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  #status {
    position: fixed; top: 8px; left: 8px; z-index: 1;
    font: 12px/1.4 monospace; color: #9f9; background: rgba(0,0,0,0.5);
    padding: 4px 8px; border-radius: 4px;
  }
</style>
</head>
<body>
<div id="status">connecting…</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";

const statusEl = document.getElementById("status");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(6, 4, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// +Y up, right-handed (§11) — matches three.js's own default convention, so no axis remap.
scene.add(new THREE.GridHelper(20, 20, 0x444444, 0x222222));
scene.add(new THREE.AxesHelper(1));

// Every particle as a dot, every pairwise force as a line (§10.2 --render-all) — no colliders
// or surfaces yet since neither exists before Phase 4/5.
const dotGeometry = new THREE.SphereGeometry(0.06, 8, 6);
const dotMaterial = new THREE.MeshBasicMaterial({ color: 0xffcc33 });
const draggedDotMaterial = new THREE.MeshBasicMaterial({ color: 0xff4444 });
let dots = new THREE.Group();
scene.add(dots);

const lineMaterial = new THREE.LineBasicMaterial({ color: 0x3388ff });
let lines = new THREE.LineSegments(new THREE.BufferGeometry(), lineMaterial);
scene.add(lines);

let latestStep = 0;

function applyFrame(frame) {
  latestStep = frame.step;

  // §10.1's scripted camera: engine-evaluated, so applying it here is just "set the numbers
  // we were sent" — no expression/lambda evaluation needed client-side. Omitted entirely by
  // demos with no scripted camera (see DebugFrame's own doc comment), in which case the
  // viewer's static default (set once, above) is left untouched.
  if (frame.camera) {
    const c = frame.camera;
    camera.position.set(c.position.x, c.position.y, c.position.z);
    camera.up.set(c.up.x, c.up.y, c.up.z);
    camera.lookAt(c.lookAt.x, c.lookAt.y, c.lookAt.z);
  }

  while (dots.children.length < frame.particles.length) {
    dots.add(new THREE.Mesh(dotGeometry, dotMaterial));
  }
  while (dots.children.length > frame.particles.length) {
    dots.remove(dots.children[dots.children.length - 1]);
  }
  const byId = new Map();
  frame.particles.forEach((p, i) => {
    const dot = dots.children[i];
    dot.position.set(p.x, p.y, p.z);
    dot.userData.particleId = p.id;
    dot.material = p.id === draggedParticleId ? draggedDotMaterial : dotMaterial;
    byId.set(p.id, p);
  });

  // Resolve+filter before allocating: a connection whose endpoint id isn't in this frame
  // (possible once Phase 6 destroys particles mid-run) must not leave a stale zeroed segment
  // in the buffer — that would draw a spurious line from the origin instead of just omitting it.
  const segments = frame.connections
    .map((c) => [byId.get(c.a), byId.get(c.b)])
    .filter(([a, b]) => a && b);
  const positions = new Float32Array(segments.length * 6);
  segments.forEach(([a, b], i) => {
    positions.set([a.x, a.y, a.z, b.x, b.y, b.z], i * 6);
  });
  lines.geometry.dispose();
  lines.geometry = new THREE.BufferGeometry();
  lines.geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
}

let socket = null;

function connect() {
  // Matches DebugRenderer's default WebSocket port; pass a different DebugRenderer(webSocketPort=)
  // and this needs to change too — Phase 3 is deliberately this minimal.
  const ws = new WebSocket(`ws://${location.hostname}:8887`);
  socket = ws;
  ws.onopen = () => { statusEl.textContent = "connected"; };
  ws.onclose = () => { statusEl.textContent = "disconnected — retrying…"; setTimeout(connect, 1000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (event) => {
    const frame = JSON.parse(event.data);
    statusEl.textContent = `t=${frame.t.toFixed(3)}  step=${frame.step}  particles=${frame.particles.length}`;
    applyFrame(frame);
  };
}
connect();

// --- Interactive drag (§9.4) --------------------------------------------------------------
// Picking is resolved entirely here (raycast against the currently-rendered dots) — the
// engine never needs to know about cameras or screen coordinates, only the resulting 3D
// target position. Only meaningful for a live engine attached over this WebSocket; a demo
// that doesn't wire DebugServer's onTextMessage just never receives these and nothing happens.

const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const dragPlaneHit = new THREE.Vector3();
let draggedParticleId = null;

function send(message) {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
}

function pointerToNdc(event) {
  pointerNdc.set(
    (event.clientX / window.innerWidth) * 2 - 1,
    -(event.clientY / window.innerHeight) * 2 + 1,
  );
}

renderer.domElement.addEventListener("pointerdown", (event) => {
  pointerToNdc(event);
  raycaster.setFromCamera(pointerNdc, camera);
  const hit = raycaster.intersectObjects(dots.children)[0];
  if (!hit) return;

  draggedParticleId = hit.object.userData.particleId;
  hit.object.material = draggedDotMaterial;

  // Drag plane: through the picked point, facing the camera — the standard way to turn a 2D
  // mouse position into a 3D target without the user having to separately control depth.
  const cameraForward = new THREE.Vector3();
  camera.getWorldDirection(cameraForward);
  dragPlane.setFromNormalAndCoplanarPoint(cameraForward, hit.point);

  send({ type: "drag_start", particleId: draggedParticleId, step: latestStep, x: hit.point.x, y: hit.point.y, z: hit.point.z });
  renderer.domElement.setPointerCapture(event.pointerId);
});

renderer.domElement.addEventListener("pointermove", (event) => {
  if (draggedParticleId === null) return;
  pointerToNdc(event);
  raycaster.setFromCamera(pointerNdc, camera);
  if (!raycaster.ray.intersectPlane(dragPlane, dragPlaneHit)) return;
  send({ type: "drag_move", step: latestStep, x: dragPlaneHit.x, y: dragPlaneHit.y, z: dragPlaneHit.z });
});

function endDrag(event) {
  if (draggedParticleId === null) return;
  send({ type: "drag_end", step: latestStep });
  draggedParticleId = null;
  renderer.domElement.releasePointerCapture(event.pointerId);
}
renderer.domElement.addEventListener("pointerup", endDrag);
renderer.domElement.addEventListener("pointercancel", endDrag);

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
