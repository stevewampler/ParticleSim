<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ParticleSim — viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  #status {
    position: fixed; top: 8px; left: 8px; z-index: 1;
    font: 12px/1.4 monospace; color: #9f9; background: rgba(0,0,0,0.5);
    padding: 4px 8px; border-radius: 4px;
  }
  #returnToScripted {
    position: fixed; top: 8px; right: 8px; z-index: 1;
    font: 12px/1.4 monospace; color: #fff; background: rgba(50,90,160,0.85);
    padding: 6px 10px; border-radius: 4px; border: none; cursor: pointer;
    display: none;
  }
  #meshEdgesToggle {
    position: fixed; top: 44px; right: 8px; z-index: 1;
    font: 12px/1.4 monospace; color: #fff; background: rgba(0,0,0,0.5);
    padding: 4px 8px; border-radius: 4px; display: none; align-items: center; gap: 6px;
  }
  #leftColumn {
    /* Wraps #leftPanel (outliner + object panel) and #controlPanel so they share the left
       edge's vertical space via flexbox instead of each being independently `position: fixed`
       - the latter let a tall object panel (e.g. a group's spring/damper tab, §10.4, with
       several named forces' fields) grow past controlPanel's own fixed position and visually
       overlap it, since neither one knew about the other's height. align-items: flex-start
       keeps each child's width sized to its own content (unlike flexbox's stretch default),
       matching how they sized independently before this wrapper existed. */
    position: fixed; top: 44px; left: 8px; bottom: 8px; z-index: 1;
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  }
  #controlPanel {
    flex: 0 0 auto;
    font: 12px/1.5 monospace; color: #ddd; background: rgba(0,0,0,0.55);
    padding: 8px 10px; border-radius: 4px; min-width: 170px;
  }
  #controlPanel h4 {
    margin: 0 0 4px; font-size: 10px; color: #9cf; font-weight: normal;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  #controlPanel section { margin-bottom: 10px; }
  #controlPanel section:last-child { margin-bottom: 0; }
  #statsPanel { white-space: pre; color: #9f9; }
  #eventLog { white-space: pre; color: #fc9; max-height: 110px; overflow-y: auto; }
  #bookmarkList { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
  #bookmarkList .bookmarkRow { display: flex; gap: 4px; align-items: center; }
  #bookmarkList button, #bookmarkForm button {
    font: 11px monospace; cursor: pointer; background: rgba(255,255,255,0.1);
    color: #ddd; border: 1px solid rgba(255,255,255,0.25); border-radius: 3px;
  }
  #bookmarkList .goBtn { flex: 1; text-align: left; padding: 2px 4px; }
  #bookmarkForm { display: flex; gap: 4px; }
  #timeButtons, #speedButtons { display: flex; gap: 4px; margin-bottom: 4px; }
  #timeButtons button, #speedButtons button {
    font: 11px monospace; cursor: pointer; background: rgba(255,255,255,0.1);
    color: #ddd; border: 1px solid rgba(255,255,255,0.25); border-radius: 3px; padding: 2px 6px;
  }
  #speedButtons button.active { background: rgba(80,140,220,0.5); color: #fff; }
  #bookmarkNameInput {
    width: 90px; font: 11px monospace; background: rgba(255,255,255,0.1);
    color: #ddd; border: 1px solid rgba(255,255,255,0.25); border-radius: 3px;
  }
  #sceneSelect {
    width: 100%; font: 11px monospace; background: rgba(255,255,255,0.1);
    color: #ddd; border: 1px solid rgba(255,255,255,0.25); border-radius: 3px; padding: 2px 4px;
  }
  #leftPanel {
    font: 12px/1.5 monospace; color: #ddd;
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px;
  }
  #outliner, #objectPanel {
    background: rgba(0,0,0,0.55); padding: 8px 10px; border-radius: 4px; max-width: 220px;
  }
  #outliner h4, #objectPanel h4 {
    margin: 8px 0 2px; font-size: 10px; color: #9cf; font-weight: normal;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  #outliner h4:first-child { margin-top: 0; }
  #outliner ul { margin: 0 0 4px; padding: 0; list-style: none; }
  #outliner li {
    padding: 1px 3px; color: #ddd; overflow-wrap: break-word; cursor: pointer; border-radius: 2px;
  }
  #outliner li:hover { background: rgba(255,255,255,0.12); }
  #outliner li.selected { background: rgba(80,140,220,0.4); color: #fff; }
  #outliner .outlinerEmpty { color: #666; font-style: italic; padding: 1px 3px; }
  #objectPanel { display: none; }
  #objectPanel h4:first-child { margin-top: 0; }
  #objectPanelTitle { color: #fff; font-weight: bold; margin-bottom: 4px; overflow-wrap: break-word; }
  #objectPanel label { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
  #objectPanel .noRenderer { color: #888; font-style: italic; }
  #objectPanel .objectInfo { color: #9f9; margin-top: 2px; }
  #objectPanel .objectInspect { color: #9cf; margin-top: 2px; white-space: pre-line; }
  #colorLegend {
    position: fixed; bottom: 8px; right: 8px; z-index: 1;
    font: 12px/1.5 monospace; color: #ddd; background: rgba(0,0,0,0.55);
    padding: 8px 10px; border-radius: 4px; display: none;
  }
  #colorLegend h4 {
    margin: 0 0 5px; font-size: 10px; color: #9cf; font-weight: normal;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  /* Matches particlesim.render.ColorRamp.blueOrange's Okabe-Ito palette exactly (0,114,178) ->
     (230,159,0) - a visual constant, not derived from live data, so it's fine to hardcode here
     rather than compute it in JS from values that never change at runtime. */
  #colorLegendBar {
    width: 160px; height: 10px; border-radius: 3px;
    background: linear-gradient(to right, rgb(0,114,178), rgb(230,159,0));
  }
  #colorLegendLabels { display: flex; justify-content: space-between; font-size: 10px; margin-top: 3px; color: #bbb; }
</style>
</head>
<body>
<div id="status">connecting…</div>
<button id="returnToScripted">return to scripted camera</button>
<label id="meshEdgesToggle"><input type="checkbox" id="meshEdgesCheckbox"> show mesh edges</label>
<div id="leftColumn">
  <div id="leftPanel">
    <div id="outliner">
      <h4>groups</h4>
      <div id="outlinerGroups"></div>
      <h4>forces</h4>
      <div id="outlinerForces"></div>
      <h4>constraints</h4>
      <div id="outlinerConstraints"></div>
      <h4>surfaces</h4>
      <div id="outlinerSurfaces"></div>
      <h4>colliders</h4>
      <div id="outlinerColliders"></div>
    </div>
    <div id="objectPanel">
      <div id="objectPanelTitle"></div>
      <div id="objectPanelBody"></div>
    </div>
  </div>
  <div id="controlPanel">
    <section id="scenePicker" style="display:none;">
      <h4>scene</h4>
      <select id="sceneSelect"></select>
    </section>
    <section>
      <h4>display</h4>
      <label><input type="checkbox" id="gridToggle" checked> grid</label><br>
      <label><input type="checkbox" id="axesToggle" checked> axes</label><br>
      <label><input type="checkbox" id="collidersToggle" checked> colliders</label>
    </section>
    <section>
      <h4>time</h4>
      <div id="timeButtons">
        <button id="playPauseBtn">⏸ pause</button>
        <button id="stepOnceBtn">⏭ step</button>
        <button id="restartBtn">↺ restart</button>
      </div>
      <div id="speedButtons">
        <button data-speed="0.25">0.25x</button>
        <button data-speed="0.5">0.5x</button>
        <button data-speed="1" class="active">1x</button>
        <button data-speed="2">2x</button>
        <button data-speed="4">4x</button>
      </div>
      <label><input type="checkbox" id="pauseOnEditToggle"> pause on edit</label>
    </section>
    <section>
      <h4>stats</h4>
      <div id="statsPanel">–</div>
    </section>
    <section>
      <h4>events</h4>
      <div id="eventLog">–</div>
    </section>
    <section>
      <h4>camera bookmarks</h4>
      <div id="bookmarkList"></div>
      <div id="bookmarkForm">
        <input type="text" id="bookmarkNameInput" placeholder="name" maxlength="20">
        <button id="saveBookmarkBtn">save</button>
      </div>
    </section>
  </div>
</div>
<div id="colorLegend">
  <h4>break proximity</h4>
  <div id="colorLegendBar"></div>
  <div id="colorLegendLabels"><span>0 · at rest</span><span>1 · about to break</span></div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const statusEl = document.getElementById("status");
const returnToScriptedEl = document.getElementById("returnToScripted");
const meshEdgesToggleEl = document.getElementById("meshEdgesToggle");
const meshEdgesCheckboxEl = document.getElementById("meshEdgesCheckbox");
let showMeshEdges = false;
meshEdgesCheckboxEl.addEventListener("change", () => {
  showMeshEdges = meshEdgesCheckboxEl.checked;
  // Doesn't touch overlay.visible directly - applyFrame is this value's single writer, since it
  // also has to factor in a per-surface hiddenSurfaces toggle (§10.3) that this listener has no
  // way to know about. The next frame (at most ~16ms away) picks the new showMeshEdges value up.
});

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(6, 4, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// +Y up, right-handed (§11) — matches three.js's own default convention, so no axis remap.
// Named (not anonymous) so §10.3's global toggles can flip .visible on them directly.
const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
scene.add(gridHelper);
const axesHelper = new THREE.AxesHelper(1);
scene.add(axesHelper);

document.getElementById("gridToggle").addEventListener("change", (e) => { gridHelper.visible = e.target.checked; });
document.getElementById("axesToggle").addEventListener("change", (e) => { axesHelper.visible = e.target.checked; });
document.getElementById("collidersToggle").addEventListener("change", (e) => { colliderGroup.visible = e.target.checked; });
document.getElementById("pauseOnEditToggle").addEventListener("change", (e) => { pauseOnEdit = e.target.checked; });

// Lighting for §10.2's shaded surface meshes — MeshBasicMaterial (dots, wireframe meshes)
// doesn't need this, but a solid MeshStandardMaterial surface would render pure black without it.
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
sunLight.position.set(5, 10, 7);
scene.add(sunLight);

// --- Camera: scripted (engine-evaluated, §10.1) vs. manual (viewer-local orbit) -----------
// Both drive the *same* camera object; only one writes to it on any given frame, decided by
// cameraMode, so they never fight each other. OrbitControls stays enabled at all times so its
// own pointer/wheel listeners can detect "the user just grabbed the viewport" via its "start"
// event even while scripted mode has been driving the camera up to that point — but its
// internal state is only ever *applied* to the camera (via controls.update()) while in manual
// mode, and applyFrame only ever writes the server's camera pose while in scripted mode.
const controls = new OrbitControls(camera, renderer.domElement);
let cameraMode = "scripted";
let lastScriptedLookAt = new THREE.Vector3(0, 0, 0);

function enterManualCamera() {
  if (cameraMode === "manual") return;
  cameraMode = "manual";
  controls.target.copy(lastScriptedLookAt);
  returnToScriptedEl.style.display = "block";
}
controls.addEventListener("start", enterManualCamera);
returnToScriptedEl.addEventListener("click", () => {
  cameraMode = "scripted";
  returnToScriptedEl.style.display = "none";
});

// --- Camera bookmarks (§10.3) -------------------------------------------------------------
// Session-only (in-memory), not persisted across a page reload — nothing in §10.3 asks for
// cross-session persistence, and viewer state today is generally ephemeral (mesh-edges toggle,
// global display toggles above are the same). Restoring a bookmark must switch into manual mode
// first: applyFrame only ever writes the scripted pose while cameraMode is "scripted" (see
// above), so setting the camera here while still scripted would just get overwritten by the
// very next frame.
const bookmarkListEl = document.getElementById("bookmarkList");
const bookmarkNameInputEl = document.getElementById("bookmarkNameInput");
const bookmarks = new Map(); // name -> { position: THREE.Vector3, target: THREE.Vector3 }

function goToBookmark(name) {
  const bookmark = bookmarks.get(name);
  if (!bookmark) return;
  enterManualCamera(); // may set controls.target to lastScriptedLookAt - overwritten right below
  camera.position.copy(bookmark.position);
  controls.target.copy(bookmark.target);
  controls.update();
}

function renderBookmarkList() {
  bookmarkListEl.innerHTML = "";
  for (const name of bookmarks.keys()) {
    const row = document.createElement("div");
    row.className = "bookmarkRow";
    const goBtn = document.createElement("button");
    goBtn.className = "goBtn";
    goBtn.textContent = name;
    goBtn.addEventListener("click", () => goToBookmark(name));
    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "×";
    deleteBtn.title = `remove "${name}"`;
    deleteBtn.addEventListener("click", () => { bookmarks.delete(name); renderBookmarkList(); });
    row.append(goBtn, deleteBtn);
    bookmarkListEl.appendChild(row);
  }
}

document.getElementById("saveBookmarkBtn").addEventListener("click", () => {
  const name = bookmarkNameInputEl.value.trim();
  if (!name) return;
  bookmarks.set(name, { position: camera.position.clone(), target: controls.target.clone() });
  bookmarkNameInputEl.value = "";
  renderBookmarkList();
});
bookmarkNameInputEl.addEventListener("keydown", (event) => {
  if (event.key === "Enter") document.getElementById("saveBookmarkBtn").click();
});

// Every particle as a dot by default (§10.2 --render-all); a particle with a declared sphere
// radius is the *same* dot mesh just scaled up (spheres are what dots already are, geometrically),
// and a particle listed in a frame's visibleIds-exclusion is skipped entirely — see applyFrame.
const BASE_DOT_RADIUS = 0.06;
const dotGeometry = new THREE.SphereGeometry(BASE_DOT_RADIUS, 8, 6);
const dotMaterial = new THREE.MeshBasicMaterial({ color: 0xffcc33 });
const draggedDotMaterial = new THREE.MeshBasicMaterial({ color: 0xff4444 });
let dots = new THREE.Group();
scene.add(dots);

// vertexColors so each connection can carry its own §10.2 breakProximity-mapped color
// (or the server's default line blue when nothing overrides it) instead of one uniform color.
const lineMaterial = new THREE.LineBasicMaterial({ vertexColors: true });
let lines = new THREE.LineSegments(new THREE.BufferGeometry(), lineMaterial);

// --- Color legend (§10.3) -----------------------------------------------------------------
// "Whenever a colorBy gradient is active anywhere in the scene" - there's no explicit per-
// connection tag on the wire saying *which* colorBy produced a color (BinaryFrame's connections
// just carry a resolved r,g,b), so activity is detected the same way a person would notice it:
// any connection whose color isn't the uncolored default. That's a sound heuristic today because
// exactly one colorBy variant exists (BREAK_PROXIMITY, §10.2) - if a second one is ever added,
// this needs to become variant-aware (which gradient, which two labels) rather than assuming
// "not the default color" always means breakProximity specifically.
const colorLegendEl = document.getElementById("colorLegend");
const DEFAULT_LINE_COLOR = { r: 0x33 / 255, g: 0x88 / 255, b: 0xff / 255 }; // mirrors Color.DEFAULT_LINE

function isDefaultLineColor(color) {
  return color.r === DEFAULT_LINE_COLOR.r && color.g === DEFAULT_LINE_COLOR.g && color.b === DEFAULT_LINE_COLOR.b;
}

function updateColorLegend(frame) {
  const active = frame.connections.some((c) => !isDefaultLineColor(c.color));
  colorLegendEl.style.display = active ? "block" : "none";
}
scene.add(lines);

// §10.2 surface meshes (shaded solid or wireframe) and arrow-sampled field forces — pooled
// like dots/lines, grown/shrunk to match each frame's declared count rather than rebuilt from
// scratch every frame.
//
// polygonOffset on the solid material pushes its depth values slightly back so anything
// coplanar with it (the structural-spring lines, and the optional edge overlay below) renders
// cleanly on top instead of z-fighting — without it, a solid mesh sharing exact vertex
// positions with a LineSegments object flickers unpredictably as the camera or the mesh's own
// shape changes, which got a lot more visible once dragging could deform the surface unevenly.
const solidMeshMaterial = () => new THREE.MeshStandardMaterial({
  color: 0x3388ff, side: THREE.DoubleSide, roughness: 0.85,
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
});
const wireframeMeshMaterial = () => new THREE.MeshBasicMaterial({ color: 0x3388ff, wireframe: true });
let meshObjects = []; // THREE.Mesh[], each carrying userData.triangleVertexIds for picking
let meshGroup = new THREE.Group();
scene.add(meshGroup);

// A viewer-local "show mesh edges" toggle, independent of the server's own per-mesh wireframe
// flag (which chooses solid-vs-wireframe-only rendering) — this overlays a wireframe on top of
// an otherwise-solid mesh, the usual way to let someone see the triangulation without losing
// the shading. Uses the same edges every frame's geometry has, so it's just as pooled/rebuilt.
const edgeOverlayMaterial = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 });
let meshEdgeOverlays = []; // THREE.LineSegments[], one per mesh, parallel to meshObjects

const ARROW_COLOR = 0xffaa33;
let arrowObjects = []; // THREE.ArrowHelper[]
let arrowGroup = new THREE.Group();
scene.add(arrowGroup);

// §10.2's debug-render-all collider wireframes (planes/spheres/boxes) - unconditional, not
// pooled against a per-frame "declared renderer" the way meshes/spheres are, since a collider
// has no renderer-declaration equivalent at all yet. Rebuilt whenever the collider *list*
// itself changes shape (kind or count), not every frame - unlike particles/meshes, nothing
// server-side moves a collider's geometry parameters within a single demo run today, so
// rebuilding on every frame would be pure waste. If a future moving-collider demo needs live
// updates here, this is the spot to revisit.
const colliderMaterial = new THREE.LineBasicMaterial({ color: 0x3399ff, transparent: true, opacity: 0.6 });
let colliderObjects = []; // THREE.LineSegments[]
let colliderGroup = new THREE.Group();
scene.add(colliderGroup);
let lastColliderSignature = "";

function buildColliderGeometry(c) {
  if (c.kind === "plane") {
    const s = c.renderHalfSize * 2;
    return new THREE.PlaneGeometry(s, s, 6, 6);
  }
  if (c.kind === "sphere") {
    return new THREE.SphereGeometry(c.radius, 16, 12);
  }
  return new THREE.BoxGeometry(c.halfExtents.x * 2, c.halfExtents.y * 2, c.halfExtents.z * 2);
}

function updateColliders(colliders) {
  latestColliders = colliders;
  // Cheap change-detection signature (kind+shape only - position could move for a moving
  // collider, but nothing does yet, see this section's own doc comment above) so a static
  // scene's colliders aren't torn down and rebuilt every single frame for no reason. A removal
  // always changes colliders.length even when the signature string doesn't (e.g. one wall out
  // of four identical-shaped ones), so the length check alone still catches it.
  const signature = JSON.stringify(colliders.map((c) => [c.kind, c.radius, c.halfExtents, c.normal, c.renderHalfSize]));
  if (signature === lastColliderSignature && colliderObjects.length === colliders.length) {
    return;
  }
  lastColliderSignature = signature;

  // §10.3's outliner for colliders is driven by the registry (updateOutliner), not this list -
  // this array is filtered to `active` colliders only (see DebugRenderer.broadcast), so an
  // inactive collider would otherwise vanish from the outliner along with its wireframe.

  while (colliderObjects.length < colliders.length) {
    const obj = new THREE.LineSegments(new THREE.BufferGeometry(), colliderMaterial);
    colliderGroup.add(obj);
    colliderObjects.push(obj);
  }
  while (colliderObjects.length > colliders.length) {
    colliderGroup.remove(colliderObjects.pop());
  }

  colliders.forEach((c, i) => {
    const obj = colliderObjects[i];
    obj.geometry.dispose();
    obj.geometry = new THREE.WireframeGeometry(buildColliderGeometry(c));
    obj.position.set(c.position.x, c.position.y, c.position.z);
    if (c.kind === "plane") {
      // PlaneGeometry's own normal is +Z; rotate it to match the collider's actual normal.
      const n = new THREE.Vector3(c.normal.x, c.normal.y, c.normal.z).normalize();
      obj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);
    } else {
      obj.quaternion.identity();
    }
  });
}

let latestStep = 0;

// Builds one mesh's geometry with *shared* (indexed) vertices, not one unconnected triangle
// per face — so computeVertexNormals() averages normals across adjacent faces for smooth
// shading, rather than every triangle getting its own flat facet. Returns null (skip this
// mesh entirely this frame) if any referenced particle isn't in the current frame.
function buildMeshGeometry(meshDecl, byId) {
  const localIndexOf = new Map();
  const positions = [];
  const indices = [];
  const triangleVertexIds = [];
  for (const tri of meshDecl.triangles) {
    const a = byId.get(tri.a), b = byId.get(tri.b), c = byId.get(tri.c);
    if (!a || !b || !c) continue; // an endpoint isn't alive this frame - omit, don't zero-fill
    for (const [id, p] of [[tri.a, a], [tri.b, b], [tri.c, c]]) {
      if (!localIndexOf.has(id)) {
        localIndexOf.set(id, positions.length / 3);
        positions.push(p.x, p.y, p.z);
      }
    }
    indices.push(localIndexOf.get(tri.a), localIndexOf.get(tri.b), localIndexOf.get(tri.c));
    triangleVertexIds.push([tri.a, tri.b, tri.c]);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(positions), 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return { geometry, triangleVertexIds };
}

function applyFrame(frame) {
  latestStep = frame.step;

  // §10.1's scripted camera: engine-evaluated, so applying it here is just "set the numbers
  // we were sent" — no expression/lambda evaluation needed client-side. Omitted entirely by
  // demos with no scripted camera, in which case the viewer's static default (set once,
  // above) is left untouched. Suppressed entirely once the viewer has switched to manual mode.
  if (frame.camera) {
    lastScriptedLookAt.set(frame.camera.lookAt.x, frame.camera.lookAt.y, frame.camera.lookAt.z);
    if (cameraMode === "scripted") {
      const c = frame.camera;
      camera.position.set(c.position.x, c.position.y, c.position.z);
      camera.up.set(c.up.x, c.up.y, c.up.z);
      camera.lookAt(c.lookAt.x, c.lookAt.y, c.lookAt.z);
    }
  }

  const byId = new Map();
  frame.particles.forEach((p) => byId.set(p.id, p));
  const sphereRadii = new Map(frame.spheres.map((s) => [s.id, s.radius]));
  latestVisibleIds = frame.visibleIds;
  latestById = byId;
  latestMeshes = frame.meshes;
  latestConnections = frame.connections;
  // null (the default, every pre-existing demo) = every particle gets a dot; otherwise only
  // the listed ids do — §10.2's "the individual cloth particles have no renderer of their own".
  const serverVisible = frame.visibleIds ? frame.particles.filter((p) => frame.visibleIds.has(p.id)) : frame.particles;
  // §10.3's group visibility toggle: a particle is hidden if it belongs to any group a person
  // has unchecked in the per-object panel, layered on top of (not instead of) the server's own
  // decision above - see hiddenGroups' own doc comment for why that order matters.
  const hiddenParticleIds = new Set();
  for (const group of frame.registry.groups) {
    if (hiddenGroups.has(group.name)) {
      for (const id of group.memberIds) hiddenParticleIds.add(id);
    }
  }
  // A selected surface reveals its own vertices as individually selectable dots - otherwise a
  // mesh-only particle (e.g. the flag's cloth, hidden via visibleIds since the mesh already
  // shows it) has no dot at all to right-click, making it unreachable through §10.4's particle
  // panel. Overrides both the server's own visibleIds exclusion *and* hiddenGroups above - an
  // explicit "let me get at this surface's particles" action wins over a group visibility
  // preference set for an unrelated reason. Purely client-side: every particle's position
  // already travels in frame.particles regardless of visibility, so revealing needs nothing
  // from the wire.
  const revealedIds = new Set();
  if (selectedKind === "surfaces") {
    const meshDecl = frame.meshes.find((m) => m.name === selectedName);
    if (meshDecl) {
      for (const tri of meshDecl.triangles) { revealedIds.add(tri.a); revealedIds.add(tri.b); revealedIds.add(tri.c); }
    }
  }
  const visibleIdSet = new Set(serverVisible.map((p) => p.id));
  for (const id of hiddenParticleIds) visibleIdSet.delete(id);
  for (const id of revealedIds) visibleIdSet.add(id);
  const visible = [...visibleIdSet].map((id) => byId.get(id)).filter(Boolean);

  while (dots.children.length < visible.length) {
    dots.add(new THREE.Mesh(dotGeometry, dotMaterial));
  }
  while (dots.children.length > visible.length) {
    dots.remove(dots.children[dots.children.length - 1]);
  }
  visible.forEach((p, i) => {
    const dot = dots.children[i];
    dot.position.set(p.x, p.y, p.z);
    dot.userData.particleId = p.id;
    dot.material = p.id === draggedParticleId ? draggedDotMaterial : dotMaterial;
    // A demo's own explicit sphereRadii entry (a cosmetic render-size declaration, §10.2) wins
    // when present - e.g. TrampolineDebugDemo's rim anchors, which have no physics radius of
    // their own at all and would otherwise render at the plain default size. Otherwise the dot
    // now tracks the particle's own live physics radius (ParticleStore.radius, always fresh on
    // the wire) - unifying what used to be two independent concepts, and the reason a live
    // radius edit (§10.4) now visibly changes dot size for a particle with no such override.
    const radius = sphereRadii.get(p.id) ?? (Number.isNaN(p.radius) ? null : p.radius);
    const scale = radius ? radius / BASE_DOT_RADIUS : 1;
    dot.scale.setScalar(scale);
  });

  // Resolve+filter before allocating: a connection whose endpoint id isn't in this frame
  // (possible once Phase 6 destroys particles mid-run) must not leave a stale zeroed segment
  // in the buffer — that would draw a spurious line from the origin instead of just omitting it.
  const segments = frame.connections
    .map((c) => [byId.get(c.a), byId.get(c.b), c.color])
    .filter(([a, b]) => a && b);
  const positions = new Float32Array(segments.length * 6);
  const colors = new Float32Array(segments.length * 6);
  segments.forEach(([a, b, color], i) => {
    positions.set([a.x, a.y, a.z, b.x, b.y, b.z], i * 6);
    colors.set([color.r, color.g, color.b, color.r, color.g, color.b], i * 6);
  });
  lines.geometry.dispose();
  lines.geometry = new THREE.BufferGeometry();
  lines.geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  lines.geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  updateColorLegend(frame);
  updateColliders(frame.colliders);

  // Surface meshes (§10.2): rebuilt every frame (positions move every step) but the pool of
  // THREE.Mesh objects itself is grown/shrunk, not recreated, matching the dots/lines pattern.
  while (meshObjects.length < frame.meshes.length) {
    const obj = new THREE.Mesh(new THREE.BufferGeometry(), solidMeshMaterial());
    meshGroup.add(obj);
    meshObjects.push(obj);
    const overlay = new THREE.LineSegments(new THREE.BufferGeometry(), edgeOverlayMaterial);
    overlay.visible = showMeshEdges;
    meshGroup.add(overlay);
    meshEdgeOverlays.push(overlay);
  }
  while (meshObjects.length > frame.meshes.length) {
    meshGroup.remove(meshObjects.pop());
    meshGroup.remove(meshEdgeOverlays.pop());
  }
  meshEdgesToggleEl.style.display = frame.meshes.length > 0 ? "flex" : "none";
  frame.meshes.forEach((meshDecl, i) => {
    const obj = meshObjects[i];
    obj.geometry.dispose();
    const built = buildMeshGeometry(meshDecl, byId);
    obj.geometry = built.geometry;
    obj.userData.triangleVertexIds = built.triangleVertexIds;
    obj.userData.surfaceName = meshDecl.name; // "" when unnamed - right-click resolves this to a panel
    obj.material = meshDecl.wireframe ? wireframeMeshMaterial() : solidMeshMaterial();

    const overlay = meshEdgeOverlays[i];
    overlay.geometry.dispose();
    overlay.geometry = new THREE.WireframeGeometry(built.geometry);

    // §10.3's surface visibility toggle: meshDecl.name is "" for an unnamed Surface, which never
    // matches anything in hiddenSurfaces (nothing unnamed is reachable in the outliner to hide
    // it with), so this is a no-op for every mesh that existed before this feature.
    const hiddenByToggle = meshDecl.name !== "" && hiddenSurfaces.has(meshDecl.name);
    obj.visible = !hiddenByToggle;
    overlay.visible = !hiddenByToggle && showMeshEdges;
  });

  // Arrow-sampled field forces (§10.2), grouped by source force. §10.3's per-force visibility
  // toggle (hiddenForces) hides a whole group by name before flattening - an unnamed group's
  // name is "" which never matches anything in hiddenForces (nothing unnamed is reachable in the
  // outliner to hide it with), same convention as hiddenSurfaces/hiddenGroups. One ArrowHelper
  // per visible sample, pooled the same way dots/lines are.
  latestArrowGroups = frame.arrowGroups;
  const visibleArrowSamples = [];
  for (const group of frame.arrowGroups) {
    if (group.name !== "" && hiddenForces.has(group.name)) continue;
    for (const sample of group.samples) visibleArrowSamples.push(sample);
  }
  while (arrowObjects.length < visibleArrowSamples.length) {
    const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 1, ARROW_COLOR);
    arrowGroup.add(arrow);
    arrowObjects.push(arrow);
  }
  while (arrowObjects.length > visibleArrowSamples.length) {
    arrowGroup.remove(arrowObjects.pop());
  }
  visibleArrowSamples.forEach((sample, i) => {
    const arrow = arrowObjects[i];
    const dir = new THREE.Vector3(sample.vector.x, sample.vector.y, sample.vector.z);
    const length = dir.length();
    arrow.position.set(sample.origin.x, sample.origin.y, sample.origin.z);
    if (length > 1e-9) {
      arrow.setDirection(dir.normalize());
      // Head sized as a modest fraction of the shaft, capped small in absolute terms too -
      // the previous 0.3/0.15 caps were close to a third of a typical arrow's own length,
      // reading as an oversized arrowhead rather than a thin shaft with a point.
      arrow.setLength(length, Math.min(0.12, length * 0.2), Math.min(0.06, length * 0.1));
      arrow.visible = true;
    } else {
      arrow.visible = false; // a zero-length arrow has no defined direction to draw
    }
  });

  updateInspection(); // text-only refresh (info + live readout) - see each module's own updateLive
}

// --- Binary frame decoding (§9.1) ---------------------------------------------------------
// Mirrors particlesim.debug.BinaryFrame's layout exactly (little-endian throughout) - see
// that class's own doc comment for the full field-by-field layout.
const utf8Decoder = new TextDecoder("utf-8");

function decodeFrame(buffer) {
  const view = new DataView(buffer);
  let offset = 0;
  const readVec = () => {
    const x = view.getFloat64(offset, true); offset += 8;
    const y = view.getFloat64(offset, true); offset += 8;
    const z = view.getFloat64(offset, true); offset += 8;
    return { x, y, z };
  };
  const readString = () => {
    const len = view.getInt32(offset, true); offset += 4;
    const str = utf8Decoder.decode(new Uint8Array(buffer, offset, len));
    offset += len;
    return str;
  };
  const readNameList = () => {
    const count = view.getInt32(offset, true); offset += 4;
    const names = new Array(count);
    for (let i = 0; i < count; i++) names[i] = readString();
    return names;
  };
  const readGroupList = () => {
    const count = view.getInt32(offset, true); offset += 4;
    const groups = new Array(count);
    for (let i = 0; i < count; i++) {
      const name = readString();
      const memberCount = view.getInt32(offset, true); offset += 4;
      const memberIds = new Set();
      for (let j = 0; j < memberCount; j++) { memberIds.add(view.getInt32(offset, true)); offset += 4; }
      groups[i] = { name, memberIds };
    }
    return groups;
  };
  // §10.4's collider activation state - kept in the registry (unlike the unconditional
  // wireframe section below, which a deactivated collider drops out of entirely) so its name
  // and current "active" flag stay reachable to reactivate it from the outliner.
  const readColliderRegistryList = () => {
    const count = view.getInt32(offset, true); offset += 4;
    const colliders = new Array(count);
    for (let i = 0; i < count; i++) {
      const name = readString();
      const active = view.getUint8(offset) !== 0; offset += 1;
      colliders[i] = { name, active };
    }
    return colliders;
  };
  // §10.4's group enable/disable state - a plain name->bool map, same {name, u8 bool} shape as
  // the collider registry list above but with nothing else to carry per entry.
  const readBoolNameMap = () => {
    const count = view.getInt32(offset, true); offset += 4;
    const result = {};
    for (let i = 0; i < count; i++) {
      const name = readString();
      result[name] = view.getUint8(offset) !== 0; offset += 1;
    }
    return result;
  };
  // §10.4's numeric-field read path: a flat list, one entry per EditableFields field a named
  // force/constraint currently exposes - see BinaryFrame's own doc comment on why this isn't
  // nested under the owning entity.
  const readFieldEntryList = () => {
    const count = view.getInt32(offset, true); offset += 4;
    const entries = new Array(count);
    for (let i = 0; i < count; i++) {
      const kind = view.getUint8(offset) === 0 ? "force" : "constraint"; offset += 1;
      const name = readString();
      const field = readString();
      const valueKind = view.getUint8(offset); offset += 1;
      const value = valueKind === 0
        ? { kind: "scalar", value: view.getFloat64(offset, true) }
        : { kind: "vector", ...readVec() };
      if (valueKind === 0) offset += 8;
      entries[i] = { kind, name, field, value };
    }
    return entries;
  };

  const t = view.getFloat64(offset, true); offset += 8;
  const step = Number(view.getBigInt64(offset, true)); offset += 8;
  const particleCount = view.getInt32(offset, true); offset += 4;
  const particles = new Array(particleCount);
  for (let i = 0; i < particleCount; i++) {
    const id = view.getInt32(offset, true); offset += 4;
    const x = view.getFloat64(offset, true); offset += 8;
    const y = view.getFloat64(offset, true); offset += 8;
    const z = view.getFloat64(offset, true); offset += 8;
    const vx = view.getFloat64(offset, true); offset += 8;
    const vy = view.getFloat64(offset, true); offset += 8;
    const vz = view.getFloat64(offset, true); offset += 8;
    const mass = view.getFloat64(offset, true); offset += 8;
    const radius = view.getFloat64(offset, true); offset += 8; // NaN = unset, matching ParticleStore
    particles[i] = { id, x, y, z, vx, vy, vz, mass, radius };
  }
  const connectionCount = view.getInt32(offset, true); offset += 4;
  const connections = new Array(connectionCount);
  for (let i = 0; i < connectionCount; i++) {
    const a = view.getInt32(offset, true); offset += 4;
    const b = view.getInt32(offset, true); offset += 4;
    const r = view.getFloat64(offset, true); offset += 8;
    const g = view.getFloat64(offset, true); offset += 8;
    const bl = view.getFloat64(offset, true); offset += 8;
    const forceName = readString(); // "" = not tagged back to a named Spring/Damper/MeshSprings
    connections[i] = { a, b, color: { r, g, b: bl }, forceName };
  }
  const hasCamera = view.getUint8(offset); offset += 1;
  const cam = hasCamera ? { position: readVec(), lookAt: readVec(), up: readVec() } : null;

  const sphereCount = view.getInt32(offset, true); offset += 4;
  const spheres = new Array(sphereCount);
  for (let i = 0; i < sphereCount; i++) {
    const id = view.getInt32(offset, true); offset += 4;
    const radius = view.getFloat64(offset, true); offset += 8;
    spheres[i] = { id, radius };
  }

  const meshCount = view.getInt32(offset, true); offset += 4;
  const meshes = new Array(meshCount);
  for (let i = 0; i < meshCount; i++) {
    const wireframe = view.getUint8(offset) !== 0; offset += 1;
    const name = readString(); // "" when the mesh's Surface is unnamed - never matches an outliner entry
    const triangleCount = view.getInt32(offset, true); offset += 4;
    const triangles = new Array(triangleCount);
    for (let j = 0; j < triangleCount; j++) {
      const a = view.getInt32(offset, true); offset += 4;
      const b = view.getInt32(offset, true); offset += 4;
      const c = view.getInt32(offset, true); offset += 4;
      triangles[j] = { a, b, c };
    }
    meshes[i] = { wireframe, name, triangles };
  }

  // Arrow samples grouped by their source force's name (§10.3's per-force visibility toggle -
  // see BinaryFrame's own doc comment for why the name travels with the samples instead of a
  // separate lookup). name is "" for an unnamed force, same convention as a mesh's name.
  const arrowGroupCount = view.getInt32(offset, true); offset += 4;
  const arrowGroups = new Array(arrowGroupCount);
  for (let i = 0; i < arrowGroupCount; i++) {
    const name = readString();
    const sampleCount = view.getInt32(offset, true); offset += 4;
    const samples = new Array(sampleCount);
    for (let j = 0; j < sampleCount; j++) samples[j] = { origin: readVec(), vector: readVec() };
    arrowGroups[i] = { name, samples };
  }

  const hasVisibleIds = view.getUint8(offset) !== 0; offset += 1;
  let visibleIds = null;
  if (hasVisibleIds) {
    const visibleCount = view.getInt32(offset, true); offset += 4;
    visibleIds = new Set();
    for (let i = 0; i < visibleCount; i++) {
      visibleIds.add(view.getInt32(offset, true)); offset += 4;
    }
  }

  // §10.3's outliner data (SceneRegistry) - name lists for forces/constraints/surfaces, plus
  // current member ids for groups (needed for the group visibility toggle - see applyFrame's
  // hiddenGroups handling). Sent unconditionally, so a demo with nothing named just yields empty
  // arrays here, not a missing field.
  const registry = {
    forces: readNameList(),
    constraints: readNameList(),
    surfaces: readNameList(),
    groups: readGroupList(),
    colliders: readColliderRegistryList(),
    groupEnabled: readBoolNameMap(),
    fields: readFieldEntryList(),
  };

  // §10.2's "debug/--render-all mode... draws every collider as wireframe" - unconditional,
  // not opt-in like every other renderer here (see BinaryFrame's own doc comment).
  const colliderCount = view.getInt32(offset, true); offset += 4;
  const colliders = new Array(colliderCount);
  for (let i = 0; i < colliderCount; i++) {
    const kind = view.getUint8(offset); offset += 1;
    const name = readString();
    const position = readVec();
    if (kind === 0) {
      const normal = readVec();
      const renderHalfSize = view.getFloat64(offset, true); offset += 8;
      colliders[i] = { kind: "plane", name, position, normal, renderHalfSize };
    } else if (kind === 1) {
      const radius = view.getFloat64(offset, true); offset += 8;
      colliders[i] = { kind: "sphere", name, position, radius };
    } else {
      colliders[i] = { kind: "box", name, position, halfExtents: readVec() };
    }
  }

  // §9.1's discrete-event channel - "something happened between the previous frame and this
  // one," only ever present the frame it happened (never resent), unlike everything above.
  const eventCount = view.getInt32(offset, true); offset += 4;
  const events = new Array(eventCount);
  for (let i = 0; i < eventCount; i++) {
    const kind = view.getUint8(offset); offset += 1;
    if (kind === 0) {
      events[i] = { kind: "forceBreak", name: readString() };
    } else if (kind === 1) {
      events[i] = { kind: "destroyed", particleId: view.getInt32(offset, true) };
      offset += 4;
    } else {
      events[i] = { kind: "spawned", particleId: view.getInt32(offset, true) };
      offset += 4;
    }
  }

  // §9.6's scene library - empty list/name for every demo that isn't a SceneLibrary-backed
  // runner, the same "absent means empty" convention the rest of this frame already uses.
  const availableScenes = readNameList();
  const activeScene = readString();

  return {
    t, step, particles, connections, camera: cam, spheres, meshes, arrowGroups, visibleIds, registry, colliders, events,
    availableScenes, activeScene,
  };
}

// --- Time controls (§9.1/§10.3) -----------------------------------------------------------
// Sends viewer -> engine commands over the same JSON text channel drag messages already use
// (see TimeControlMessage's own doc comment for why both parsers are tried on every message
// server-side). This viewer has no server-authoritative pause-state readback - isPaused here is
// purely local, set only by this viewer's own button clicks, initialized false on page load.
// Fine for a single-viewer debug tool; a second concurrent viewer would show its own guess.
let isPaused = false;
const playPauseBtn = document.getElementById("playPauseBtn");

playPauseBtn.addEventListener("click", () => {
  isPaused = !isPaused;
  send({ type: isPaused ? "pause" : "resume" });
  playPauseBtn.textContent = isPaused ? "▶ play" : "⏸ pause";
  // Resuming shouldn't have the paused duration count as "falling behind" - see updateStats'
  // own lag comment for why an attaching-mid-run viewer needs the same fresh-anchor treatment.
  if (!isPaused) resetStats();
});

document.getElementById("stepOnceBtn").addEventListener("click", () => {
  send({ type: "step_once" });
  // TimeControl always leaves the engine paused right after a step (see its own doc comment) -
  // reflect that locally immediately rather than waiting a frame for confirmation.
  isPaused = true;
  playPauseBtn.textContent = "▶ play";
});

// §9.6's scene switch (restart is now "reload the active scene by name," the same
// discard-and-rebuild the picker below triggers for a different name): every bit of
// viewer-side state a new scene has no way to know about gets cleared, not just stats/events -
// selection and the per-object panel it drives, plus the hidden-group/-surface/-force toggles,
// which would otherwise silently persist onto a scene whose names may not even mean the same
// thing (or exist at all).
function resetViewerStateForSceneChange() {
  resetStats();
  resetEventLog();
  selectedKind = null;
  selectedName = null;
  hiddenGroups.clear();
  hiddenSurfaces.clear();
  hiddenForces.clear();
  updateSelectionHighlight();
  renderObjectPanel();
  // applyFrame only ever writes the camera when frame.camera is non-null (§10.1's scripted
  // camera is opt-in per scene) - a scene with no scripted camera would otherwise inherit
  // whatever pose the *previous* scene's orbit last computed, leaving the new scene badly
  // framed or off-screen. Unconditionally forcing scripted mode here (not just resetting the
  // pose while already in it) matters just as much: if the user had ever manually orbited the
  // view - on this scene or an earlier one - cameraMode stays "manual" indefinitely until they
  // click "return to scripted," so a reset gated on cameraMode === "scripted" would silently
  // no-op and leave the camera exactly where they last dragged it. A scene switch is a big
  // enough context change that carrying over a manual framing from the *previous* scene doesn't
  // make sense either way, so this always drops back to scripted and the default pose - a scene
  // with its own scripted camera overwrites it on the very next frame (costs nothing there).
  cameraMode = "scripted";
  returnToScriptedEl.style.display = "none";
  lastScriptedLookAt.set(0, 0, 0);
  camera.position.set(6, 4, 8);
  camera.up.set(0, 1, 0);
  camera.lookAt(0, 0, 0);
}

// §10.3's restart: a SceneControlMessage (not TimeControlMessage - this replaces the scene
// itself, not just pacing), handled per-demo (currently just ParticleCollisionDebugDemo; a demo
// that doesn't understand "restart" just ignores it, same "unrecognized types are silently
// dropped" stance every message type here already takes).
document.getElementById("restartBtn").addEventListener("click", () => {
  send({ type: "restart" });
  resetViewerStateForSceneChange();
});

// §9.6's scene picker - hidden (see its own CSS) until a frame reports a non-empty
// availableScenes, which only a SceneLibrary-backed runner (SceneLibraryDebugDemo) ever does.
const scenePickerEl = document.getElementById("scenePicker");
const sceneSelectEl = document.getElementById("sceneSelect");
let lastAvailableScenes = null; // avoid rebuilding <option>s (and losing the user's open dropdown) every frame

function updateScenePicker(frame) {
  if (frame.availableScenes.length === 0) {
    scenePickerEl.style.display = "none";
    lastAvailableScenes = null;
    return;
  }
  scenePickerEl.style.display = "block";
  const namesChanged = !lastAvailableScenes ||
    lastAvailableScenes.length !== frame.availableScenes.length ||
    frame.availableScenes.some((name, i) => name !== lastAvailableScenes[i]);
  if (namesChanged) {
    sceneSelectEl.innerHTML = "";
    for (const name of frame.availableScenes) {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      sceneSelectEl.appendChild(option);
    }
    lastAvailableScenes = frame.availableScenes;
  }
  if (document.activeElement !== sceneSelectEl) sceneSelectEl.value = frame.activeScene;
}

sceneSelectEl.addEventListener("change", () => {
  send({ type: "load_scene", name: sceneSelectEl.value });
  resetViewerStateForSceneChange();
});

document.querySelectorAll("#speedButtons button").forEach((btn) => {
  btn.addEventListener("click", () => {
    send({ type: "set_speed", multiplier: parseFloat(btn.dataset.speed) });
    document.querySelectorAll("#speedButtons button").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
  });
});

// --- Stats overlay (§10.3) ----------------------------------------------------------------
// Particle count is a direct frame readout; step rate and lag both need a wall-clock anchor,
// reset on every fresh connection (not just once ever) so reconnecting to a *different* demo
// process - whose own `t`/`step` restart near zero - doesn't compare against a stale baseline
// from the previous process and report a nonsensical lag/rate forever.
const statsPanelEl = document.getElementById("statsPanel");
let statsAnchorWallMs = null;
let statsAnchorT = null;
let statsRateSampleWallMs = null;
let statsRateSampleStep = null;
let statsStepRate = 0;

function resetStats() {
  statsAnchorWallMs = null;
  statsAnchorT = null;
  statsRateSampleWallMs = null;
  statsRateSampleStep = null;
  statsStepRate = 0;
}

function updateStats(frame) {
  const nowMs = performance.now();
  if (statsAnchorWallMs === null) {
    statsAnchorWallMs = nowMs;
    statsAnchorT = frame.t;
    statsRateSampleWallMs = nowMs;
    statsRateSampleStep = frame.step;
  }

  // Lag (§9.1's pacing policy, made visible): drift between wall-clock elapsed and sim-time
  // elapsed since the anchor frame, not an absolute t-vs-wallclock difference - a viewer that
  // *attaches* mid-run must read ~0 lag at that moment, not "however far into the run it is."
  const wallElapsedS = (nowMs - statsAnchorWallMs) / 1000;
  const simElapsedS = frame.t - statsAnchorT;
  const lagS = wallElapsedS - simElapsedS;

  // Step rate from Δstep/Δwallclock (the engine's own step counter), sampled roughly once a
  // second - *not* frames-received-per-second, which differs from the true physics rate by
  // exactly stepsPerFrame and would misreport whenever rendered frames drop (by design, §9.1).
  const sinceSampleMs = nowMs - statsRateSampleWallMs;
  if (sinceSampleMs >= 1000) {
    statsStepRate = ((frame.step - statsRateSampleStep) / sinceSampleMs) * 1000;
    statsRateSampleWallMs = nowMs;
    statsRateSampleStep = frame.step;
  }

  // While paused, wall-clock time keeps advancing but sim time deliberately doesn't - showing
  // a growing "+Ns lag" there would misrepresent an intentional pause as the physics falling
  // behind. resetStats() on resume (see playPauseBtn's own listener) keeps this honest once
  // running again, rather than needing special-case math here to subtract out paused duration.
  const lagText = isPaused ? "— (paused)" : `${lagS >= 0 ? "+" : ""}${lagS.toFixed(2)}s`;
  statsPanelEl.textContent =
    `particles: ${frame.particles.length}\n` +
    `steps/s:   ${statsStepRate.toFixed(0)}\n` +
    `lag:       ${lagText}`;
}

// --- Discrete-event log (§9.1) ------------------------------------------------------------
// A capped, rolling readout of frame.events (SparksDebugDemo produces these continuously;
// DragDebugDemo's interactive delete produces them on demand) - a person watching the panel gets
// a legible recent history instead of the raw per-frame list, which would otherwise vanish the
// instant the next frame overwrote it. Newest first. Capped at EVENT_LOG_MAX so a
// continuously-spawning demo (Sparks) doesn't grow this array, and the DOM text it's rendered
// into, without bound for the life of the page.
const EVENT_LOG_MAX = 20;
const eventLogEl = document.getElementById("eventLog");
let eventLogEntries = []; // oldest first internally; rendered reversed

function resetEventLog() {
  eventLogEntries = [];
  eventLogEl.textContent = "–";
}

function eventLogText(e) {
  if (e.kind === "forceBreak") return `force '${e.name || "(unnamed)"}' broke`;
  if (e.kind === "destroyed") return `particle ${e.particleId} destroyed`;
  return `particle ${e.particleId} spawned`;
}

// frame.events is this frame's fresh list only (never accumulated server-side - see
// BinaryFrame's own doc comment), so appending it here is exactly "what happened since last
// frame," not a replay - a paused frame runs zero physics steps and correctly carries zero
// events, so pausing doesn't spam duplicate entries onto the log.
function updateEventLog(frame) {
  if (frame.events.length === 0) return;
  for (const e of frame.events) {
    eventLogEntries.push(`t=${frame.t.toFixed(3)}  ${eventLogText(e)}`);
  }
  if (eventLogEntries.length > EVENT_LOG_MAX) {
    eventLogEntries.splice(0, eventLogEntries.length - EVENT_LOG_MAX);
  }
  eventLogEl.textContent = eventLogEntries.slice().reverse().join("\n");
}

// §10.3/§10.4's particle panel has no registry entry to check membership against the way
// updateOutliner already does for a removed collider (`registry.colliders.some(...)`), so a
// destroyed selected particle needs its own clear here - otherwise latestById.get(id) would
// return undefined forever and the panel would just sit frozen on stale data instead of closing.
// Uses the wire's existing particleDestroyed event (double-click delete, and any future §14
// lifecycle destruction, both go through this same event) rather than a new mechanism.
function clearSelectionIfParticleDestroyed(frame) {
  if (selectedKind !== "particles") return;
  if (!frame.events.some((e) => e.kind === "destroyed" && String(e.particleId) === selectedName)) return;
  selectedKind = null;
  selectedName = null;
  updateSelectionHighlight();
  renderObjectPanel();
}

// --- Outliner & per-object panel (§10.3) --------------------------------------------------
// A persistent, always-available list of every named group/force/constraint/surface, regardless
// of what's currently rendered - the answer to "how do I reach an invisible object's settings."
// Selecting an entry opens a shared panel below the list (§10.3: "selecting an entry opens the
// same per-object panel a right-click would" - right-click-in-3D itself is still separate,
// unstarted future work).
//
// Every entity kind ("groups", "forces", "constraints", "surfaces", "colliders") is a
// self-registered entity-kind module (see registerEntityKind below): each owns its own outliner
// list contents and per-object panel body, so a new kind is additive rather than another branch
// in renderObjectPanel/updateOutliner every other kind already depends on.
const objectPanelEl = document.getElementById("objectPanel");
const objectPanelTitleEl = document.getElementById("objectPanelTitle");
const objectPanelBodyEl = document.getElementById("objectPanelBody");

let lastRegistrySignature = null;
let latestRegistry = { forces: [], constraints: [], surfaces: [], groups: [], colliders: [], groupEnabled: {}, fields: [] };
let selectedKind = null; // "groups" | "forces" | "constraints" | "surfaces" | "colliders"
let selectedName = null;
let latestVisibleIds = null; // this frame's server-side dot filter, updated every frame in applyFrame
let objectPanelInfoEl = null; // the groups panel's live "N drawable" text node, or null otherwise
let latestById = new Map(); // this frame's particles by id (position/velocity/mass/radius), for §10.3/§10.4
let latestMeshes = []; // this frame's mesh declarations, for a selected surface's inspection readout
let latestConnections = []; // this frame's spring/damper connections (a, b, color, forceName), for a group's spring/damper tab
let latestColliders = []; // this frame's colliders, for the outliner's remove action
let latestArrowGroups = []; // this frame's named arrow-sample groups, for the forces panel's toggle
let objectPanelInspectEl = null; // the groups/surfaces panel's live numeric-readout text node
let particleFieldInputs = null; // the particle panel's { massInput, radiusInput }, or null otherwise

// Names of groups/surfaces a person has explicitly unchecked in the per-object panel. Composed
// with (never replacing) whatever the server itself already decided - e.g. FlagDebugDemo sends
// visibleIds=poleIds specifically to hide cloth dots because the mesh already shows them, and
// leaving "cloth" checked here must not repaint those 112 dots back on top of the mesh. A
// particle/mesh draws only if the server permits it *and* nothing here hides it - see applyFrame.
const hiddenGroups = new Set();
const hiddenSurfaces = new Set();
const hiddenForces = new Set(); // names of forces whose arrow samples (see NamedArrowSamples) are unchecked

// A plain JSON.stringify(registry) can't detect a group's membership changing, since Set doesn't
// serialize meaningfully (every group would stringify to the same shape regardless of contents) -
// so member ids are flattened into a sorted array first, specifically so this check stays
// correct once something (a future emitter) actually changes group membership between frames.
function registrySignature(registry) {
  return JSON.stringify({
    forces: registry.forces,
    constraints: registry.constraints,
    surfaces: registry.surfaces,
    groups: registry.groups.map((g) => ({ name: g.name, memberIds: [...g.memberIds].sort((a, b) => a - b) })),
    // §10.4: active is the one per-entry field that can flip without the collider *set*
    // changing, so it has to be part of the signature or a toggle would never repaint.
    colliders: registry.colliders.map((c) => [c.name, c.active]),
    groupEnabled: registry.groupEnabled,
  });
}

function updateSelectionHighlight() {
  document.querySelectorAll("#outliner li[data-kind]").forEach((li) => {
    li.classList.toggle("selected", li.dataset.kind === selectedKind && li.dataset.name === selectedName);
  });
}

function selectObject(kind, name) {
  selectedKind = kind;
  selectedName = name;
  updateSelectionHighlight();
  renderObjectPanel();
}

// A group's member count alone doesn't explain why toggling it might do nothing visually - most
// (or all) of its members could already be excluded from dot-drawing entirely by the server's own
// visibleIds (e.g. FlagDebugDemo's cloth particles, mesh-only since the mesh already shows them).
// "N drawable right now" makes that explicit instead of leaving it to be discovered by confused
// clicking - which is exactly what motivated adding this (a real person hit this in testing).
function groupPanelInfoText(name) {
  const group = latestRegistry.groups.find((g) => g.name === name);
  if (!group) return "0 particle(s)";
  const total = group.memberIds.size;
  const drawable = latestVisibleIds ? [...group.memberIds].filter((id) => latestVisibleIds.has(id)).length : total;
  return `${total} particle(s) — ${drawable} drawable as a dot right now`;
}

// Group's spring/damper tab: "every spring/damper where all endpoints belong to this group"
// (§10.4), computed from this frame's wire-tagged connections (the connection-naming infra) -
// there's no other way for the client to learn which particles a named force touches, since a
// force object itself never reaches the wire, only its editable field values (via
// latestRegistry.fields) and, for pairwise/mesh forces, its current connections. Grouping by
// name first means a name with zero tagged connections this frame (untagged, or a MeshSprings
// whose every edge has broken - activeConnections() then empty) never appears here at all,
// rather than vacuously satisfying "every connection is inside the group" on an empty set.
function containedForceNamesForGroup(groupName) {
  const group = latestRegistry.groups.find((g) => g.name === groupName);
  if (!group) return [];
  const connectionsByName = new Map();
  for (const c of latestConnections) {
    if (!c.forceName) continue;
    if (!connectionsByName.has(c.forceName)) connectionsByName.set(c.forceName, []);
    connectionsByName.get(c.forceName).push(c);
  }
  const result = [];
  for (const [name, conns] of connectionsByName) {
    if (conns.every((c) => group.memberIds.has(c.a) && group.memberIds.has(c.b))) result.push(name);
  }
  return result;
}

// --- Selection & inspection (§10.3) -------------------------------------------------------
// "Live numeric readout for it" — extended sensibly from a single particle (what the spec's own
// examples describe: "a particle's position/velocity") to a whole group or surface, since that's
// what's actually selectable today. A group's readout is its members' centroid and average
// speed; a surface's is its unique vertex count's average speed and its triangle count. Forces
// now have a real per-force arrow visibility toggle (see the "forces" module below) but still no
// live numeric readout (no per-object magnitude on the wire yet); constraints have neither.
function vectorLength(x, y, z) { return Math.sqrt(x * x + y * y + z * z); }

function formatVec(x, y, z) { return `(${x.toFixed(2)}, ${y.toFixed(2)}, ${z.toFixed(2)})`; }

function renderNameList(container, kind, names) {
  container.innerHTML = "";
  if (names.length === 0) {
    const empty = document.createElement("div");
    empty.className = "outlinerEmpty";
    empty.textContent = "(none)";
    container.appendChild(empty);
    return;
  }
  const list = document.createElement("ul");
  for (const name of names) {
    const item = document.createElement("li");
    item.textContent = name;
    item.dataset.kind = kind;
    item.dataset.name = name;
    item.addEventListener("click", () => selectObject(kind, name));
    list.appendChild(item);
  }
  container.appendChild(list);
}

// --- Self-registering entity-kind UI modules (§10.3) --------------------------------------
// Each entity kind's outliner section + per-object panel body is owned by a module that
// registers itself here via registerEntityKind, rather than being another branch in shared
// dispatch code (renderObjectPanel/updateOutliner) that every other kind's code already lives
// in - a new kind becomes additive instead of a change to code it doesn't own. A module claims
// the outliner section the page's own HTML already declares for its kind (rather than building
// its own container from scratch), so registering is purely additive to what's already on the
// page - section order and header text stay exactly where the page put them.
//
// All six kinds are registered here - "groups" (a toggle, live info text, *and* live inspection),
// "forces" (a per-force arrow-visibility toggle, real only when that force has arrow samples this
// frame, plus editable fields), "constraints" (editable fields only - §10.2 defines no constraint
// renderer), "surfaces" (a mesh-visibility toggle plus live triangle/vertex-speed inspection),
// "colliders" (an active toggle, a remove button, and the collider's shape when active), and
// "particles" (§10.3's one kind with no outliner presence at all - see its own registration
// below for why).
const entityKindModules = new Map(); // kind -> { getNames(registry)?, renderPanel(), updateLive()? }

// getNames is the one optional hook: a kind that omits it (particles - there are potentially
// thousands, and they're never listed per §10.3's own outliner spec) has no outliner section and
// is reachable only via something else (a 3D pick) setting selectedKind/selectedName directly.
// document.getElementById returns null for a kind with no "outliner<Kind>" element in the page
// (particles has none) - harmless, since updateOutliner's render loop only ever touches
// module.sectionEl for a module that actually has getNames.
function registerEntityKind(module) {
  const capitalized = module.kind[0].toUpperCase() + module.kind.slice(1);
  module.sectionEl = document.getElementById("outliner" + capitalized);
  entityKindModules.set(module.kind, module);
}

// Shared per-object-panel building blocks - available to every entity-kind module, so they all
// build their panel bodies the exact same way.
function addPanelNote(text) {
  const note = document.createElement("div");
  note.className = "noRenderer";
  note.textContent = text;
  objectPanelBodyEl.appendChild(note);
}
function addPanelToggle(labelText, hiddenSet) {
  const label = document.createElement("label");
  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.checked = !hiddenSet.has(selectedName);
  checkbox.addEventListener("change", () => {
    if (checkbox.checked) hiddenSet.delete(selectedName); else hiddenSet.add(selectedName);
  });
  label.append(checkbox, document.createTextNode(" " + labelText));
  objectPanelBodyEl.appendChild(label);
}
function addPanelInspect() {
  const inspect = document.createElement("div");
  inspect.className = "objectInspect";
  objectPanelBodyEl.appendChild(inspect);
  objectPanelInspectEl = inspect;
}

// §10.4's numeric field editing. inputsOut/inputsIn map fieldName -> the input element(s) so
// updateEditableFieldsLive can refresh their *displayed* value without recreating them (which
// would sever an in-progress edit) - the panel as a whole is still only rebuilt on selection
// change or a registry signature change, and registrySignature deliberately excludes field
// *values* (only names/booleans) for exactly this reason: a value changing on every edit must
// never itself trigger the rebuild that would clobber the input the user is mid-edit in.
// The inputs store is passed in rather than always written to one shared global so a panel that
// renders more than one named force at once (a group's spring/damper tab) can track each one
// independently instead of the last one clobbering the others - the caller owns resetting it
// (e.g. `= {}`) before the render pass that (re)populates it.
let currentFieldInputs = {};

function renderEditableFields(kind, name, inputsOut) {
  const fields = latestRegistry.fields.filter((f) => f.kind === kind && f.name === name);
  for (const f of fields) {
    const row = document.createElement("div");
    row.className = "objectField";
    row.appendChild(document.createTextNode(f.field + ": "));
    if (f.value.kind === "scalar") {
      const input = document.createElement("input");
      input.type = "number";
      input.step = "any";
      input.value = f.value.value;
      input.addEventListener("change", () => {
        sendEdit({ type: "set_scalar_field", kind, name, field: f.field, value: parseFloat(input.value) });
      });
      row.appendChild(input);
      inputsOut[f.field] = { valueKind: "scalar", input };
    } else {
      const inputs = ["x", "y", "z"].map(() => {
        const el = document.createElement("input");
        el.type = "number";
        el.step = "any";
        el.style.width = "4.5em";
        return el;
      });
      inputs[0].value = f.value.x; inputs[1].value = f.value.y; inputs[2].value = f.value.z;
      const onChange = () => {
        sendEdit({
          type: "set_vector_field", kind, name, field: f.field,
          x: parseFloat(inputs[0].value), y: parseFloat(inputs[1].value), z: parseFloat(inputs[2].value),
        });
      };
      inputs.forEach((el) => { el.addEventListener("change", onChange); row.appendChild(el); });
      inputsOut[f.field] = { valueKind: "vector", inputs };
    }
    objectPanelBodyEl.appendChild(row);
  }
}

function updateEditableFieldsLive(kind, name, inputsIn) {
  const fields = latestRegistry.fields.filter((f) => f.kind === kind && f.name === name);
  for (const f of fields) {
    const entry = inputsIn[f.field];
    if (!entry) continue;
    if (entry.valueKind === "scalar") {
      if (document.activeElement !== entry.input) entry.input.value = f.value.value;
    } else {
      ["x", "y", "z"].forEach((axis, i) => {
        if (document.activeElement !== entry.inputs[i]) entry.inputs[i].value = f.value[axis];
      });
    }
  }
}

// The groups module's spring/damper tab tracks each qualifying named force's inputs
// independently (see renderEditableFields's own comment on why the store is passed in) - keyed
// by force name, rebuilt alongside the rest of the panel in renderPanel and refreshed in
// updateLive.
let groupForceFieldInputs = {};

registerEntityKind({
  kind: "groups",
  getNames: (registry) => registry.groups.map((g) => g.name),
  renderPanel: () => {
    addPanelToggle("show particles", hiddenGroups);

    // §10.4's group enable/disable - see Groups.isEnabled's own doc comment for what this does
    // and, just as importantly, what it doesn't (structural springs/wind keep acting on a
    // disabled group's members; only field forces/constraints/collision rules that resolve this
    // group by name each step stop).
    const enabledLabel = document.createElement("label");
    const enabledCheckbox = document.createElement("input");
    enabledCheckbox.type = "checkbox";
    enabledCheckbox.checked = latestRegistry.groupEnabled[selectedName] !== false;
    enabledCheckbox.addEventListener("change", (e) => {
      sendEdit({ type: "set_group_enabled", name: selectedName, enabled: e.target.checked });
    });
    enabledLabel.appendChild(enabledCheckbox);
    enabledLabel.appendChild(document.createTextNode(" enabled"));
    objectPanelBodyEl.appendChild(enabledLabel);

    const info = document.createElement("div");
    info.className = "objectInfo";
    info.textContent = groupPanelInfoText(selectedName);
    objectPanelBodyEl.appendChild(info);
    objectPanelInfoEl = info;
    addPanelInspect();

    const forceNames = containedForceNamesForGroup(selectedName);
    groupForceFieldInputs = {};
    if (forceNames.length === 0) {
      addPanelNote("no spring/damper is fully contained within this group (§10.4)");
    } else {
      for (const forceName of forceNames) {
        const label = document.createElement("div");
        label.className = "objectInfo";
        label.textContent = forceName + ":";
        objectPanelBodyEl.appendChild(label);
        groupForceFieldInputs[forceName] = {};
        renderEditableFields("force", forceName, groupForceFieldInputs[forceName]);
      }
    }
  },
  // Refreshes the info/inspect text nodes and every qualifying force's field inputs, never
  // recreating the checkbox/labels they sit next to - called every frame (from updateInspection,
  // itself called from applyFrame) so the "N drawable" count, the live centroid/speed, and each
  // spring/damper's numeric readout all track the current frame without risking a detached
  // checkbox mid-click or clobbering an in-progress edit.
  updateLive: () => {
    if (objectPanelInfoEl) objectPanelInfoEl.textContent = groupPanelInfoText(selectedName);
    if (objectPanelInspectEl) {
      const group = latestRegistry.groups.find((g) => g.name === selectedName);
      const memberIds = group ? group.memberIds : new Set();
      let sumX = 0, sumY = 0, sumZ = 0, sumSpeed = 0, count = 0;
      for (const id of memberIds) {
        const p = latestById.get(id);
        if (!p) continue; // not present this frame (e.g. destroyed - Phase 6, unbuilt, but defensive)
        sumX += p.x; sumY += p.y; sumZ += p.z;
        sumSpeed += vectorLength(p.vx, p.vy, p.vz);
        count++;
      }
      objectPanelInspectEl.textContent = count === 0
        ? "no live data"
        : `centroid: ${formatVec(sumX / count, sumY / count, sumZ / count)}\navg speed: ${(sumSpeed / count).toFixed(3)} m/s`;
    }
    for (const forceName of Object.keys(groupForceFieldInputs)) {
      updateEditableFieldsLive("force", forceName, groupForceFieldInputs[forceName]);
    }
  },
});

registerEntityKind({
  kind: "forces",
  getNames: (registry) => registry.forces,
  // A visibility toggle is only real when this force actually has arrow samples this frame
  // (latestArrowGroups, populated in applyFrame) - a force with no arrow renderer (e.g. plain
  // uniform gravity) has nothing here to show or hide, so it keeps the same informational note
  // as before rather than a checkbox that would silently do nothing.
  renderPanel: () => {
    const hasArrows = latestArrowGroups.some((g) => g.name === selectedName);
    if (hasArrows) addPanelToggle("show arrows", hiddenForces);
    currentFieldInputs = {};
    renderEditableFields("force", selectedName, currentFieldInputs);
    if (!hasArrows && latestRegistry.fields.every((f) => !(f.kind === "force" && f.name === selectedName))) {
      addPanelNote("no arrow renderer or editable numeric fields for this force yet (§10.2/§10.4)");
    }
  },
  updateLive: () => updateEditableFieldsLive("force", selectedName, currentFieldInputs),
});

registerEntityKind({
  kind: "constraints",
  getNames: (registry) => registry.constraints,
  // §10.2 defines no constraint renderer at all - editable fields are the only panel content.
  renderPanel: () => {
    currentFieldInputs = {};
    renderEditableFields("constraint", selectedName, currentFieldInputs);
    if (latestRegistry.fields.every((f) => !(f.kind === "constraint" && f.name === selectedName))) {
      addPanelNote("no renderer or editable numeric fields for this constraint yet (§10.2/§10.4)");
    }
  },
  updateLive: () => updateEditableFieldsLive("constraint", selectedName, currentFieldInputs),
});

registerEntityKind({
  kind: "surfaces",
  getNames: (registry) => registry.surfaces,
  renderPanel: () => {
    addPanelToggle("show mesh", hiddenSurfaces);
    addPanelInspect();
  },
  updateLive: () => {
    if (!objectPanelInspectEl) return;
    const meshDecl = latestMeshes.find((m) => m.name === selectedName);
    if (!meshDecl) { objectPanelInspectEl.textContent = "no live data"; return; }
    const vertexIds = new Set();
    for (const tri of meshDecl.triangles) { vertexIds.add(tri.a); vertexIds.add(tri.b); vertexIds.add(tri.c); }
    let sumSpeed = 0, count = 0;
    for (const id of vertexIds) {
      const p = latestById.get(id);
      if (!p) continue;
      sumSpeed += vectorLength(p.vx, p.vy, p.vz);
      count++;
    }
    objectPanelInspectEl.textContent = count === 0
      ? "no live data"
      : `${meshDecl.triangles.length} triangle(s)\navg vertex speed: ${(sumSpeed / count).toFixed(3)} m/s\n` +
        "(this surface's vertices are shown as dots while selected, even if normally mesh-only)";
  },
});

registerEntityKind({
  kind: "colliders",
  getNames: (registry) => registry.colliders.map((c) => c.name),
  renderPanel: () => {
    const collider = latestColliders.find((c) => c.name === selectedName);
    const registryEntry = latestRegistry.colliders.find((c) => c.name === selectedName);
    const info = document.createElement("div");
    info.className = "objectInfo";
    // `collider` (the wireframe/geometry entry) is undefined while inactive - see
    // updateColliders' own doc comment on why that list is filtered - so its shape ("plane"
    // etc.) just isn't shown for a deactivated collider rather than being tracked separately.
    info.textContent = collider ? collider.kind : "(inactive)";
    objectPanelBodyEl.appendChild(info);

    // §10.4's activation toggle: fully inert and hidden while unchecked, same convention as a
    // group's own enable/disable checkbox above.
    const activeLabel = document.createElement("label");
    const activeCheckbox = document.createElement("input");
    activeCheckbox.type = "checkbox";
    activeCheckbox.checked = registryEntry ? registryEntry.active : true;
    activeCheckbox.addEventListener("change", (e) => {
      sendEdit({ type: "set_collider_active", name: selectedName, active: e.target.checked });
    });
    activeLabel.appendChild(activeCheckbox);
    activeLabel.appendChild(document.createTextNode(" active"));
    objectPanelBodyEl.appendChild(activeLabel);

    const removeBtn = document.createElement("button");
    removeBtn.textContent = "remove";
    removeBtn.addEventListener("click", () => {
      send({ type: "remove_collider", name: selectedName });
      // Don't wait for the next frame's collider list to confirm it - close the panel now,
      // same "assume the click worked" immediacy as every other button on this page.
      selectedKind = null;
      selectedName = null;
      updateSelectionHighlight();
      renderObjectPanel();
    });
    objectPanelBodyEl.appendChild(removeBtn);
  },
});

// §10.3/§10.4's particle panel - the one kind with no outliner presence (see registerEntityKind's
// own comment). Reached only via a right-click pick in 3D (see the contextmenu handler below),
// which sets selectedKind/selectedName to ("particles", String(particleId)) directly - §10.3's
// literal "right-clicking a rendered object opens its per-object panel directly" read on a dot,
// not the group-opening placeholder this replaced (see TODO.md's own walkthrough of that change).
registerEntityKind({
  kind: "particles",
  renderPanel: () => {
    const particleId = Number(selectedName);
    const p = latestById.get(particleId);

    const idLine = document.createElement("div");
    idLine.className = "objectInfo";
    idLine.textContent = `particle ${particleId}`;
    objectPanelBodyEl.appendChild(idLine);

    addPanelInspect(); // live position/velocity readout, filled in by updateLive below

    // §10.4's expression-string editing (mass/radius design walkthrough): a plain text input,
    // not type="number" - the value sent is parsed server-side via ExpressionParser.parseScalar,
    // so "2.0 + 0.1*sin(t)" is exactly as valid an edit as "5.0". Always shows the live evaluated
    // number, never the original expression source - ParticleStore retains no source text to
    // show, and this matches how a force/constraint's editableFields already behave.
    const massRow = document.createElement("div");
    massRow.className = "objectField";
    massRow.appendChild(document.createTextNode("mass: "));
    const massInput = document.createElement("input");
    massInput.type = "text";
    massInput.value = p ? String(p.mass) : "";
    massInput.addEventListener("change", () => {
      sendEdit({ type: "set_particle_scalar_field", particleId, field: "mass", expression: massInput.value });
    });
    massRow.appendChild(massInput);
    objectPanelBodyEl.appendChild(massRow);

    // radius is NaN (never the unset state itself) when this particle has none - rendered as an
    // empty input, never the literal string "NaN"; editing it in is how "a particle with no
    // radius can have one added" (mass/radius design walkthrough) actually happens.
    const radiusRow = document.createElement("div");
    radiusRow.className = "objectField";
    radiusRow.appendChild(document.createTextNode("radius: "));
    const radiusInput = document.createElement("input");
    radiusInput.type = "text";
    radiusInput.value = p && !Number.isNaN(p.radius) ? String(p.radius) : "";
    radiusInput.addEventListener("change", () => {
      sendEdit({ type: "set_particle_scalar_field", particleId, field: "radius", expression: radiusInput.value });
    });
    radiusRow.appendChild(radiusInput);
    objectPanelBodyEl.appendChild(radiusRow);
    particleFieldInputs = { massInput, radiusInput };

    // The multi-group selection design: every containing group is listed as a reselectable
    // entry rather than this panel picking (or rendering) just one - clicking a link switches
    // the whole selection over to that group's own panel, the same navigation selectObject
    // already gives every other kind. Ordered smallest-membership-first - the same heuristic
    // the old right-click-opens-the-group behavior used to pick a single winner - so the more
    // specific, more-likely-intended group is listed first without forcing a single choice.
    // A particle in zero groups (previously unreachable at all through that old behavior) just
    // shows "(none)".
    const groupsLine = document.createElement("div");
    groupsLine.className = "objectInfo";
    groupsLine.appendChild(document.createTextNode("groups: "));
    const containingGroups = latestRegistry.groups
      .filter((g) => g.memberIds.has(particleId))
      .sort((a, b) => a.memberIds.size - b.memberIds.size);
    if (containingGroups.length === 0) {
      groupsLine.appendChild(document.createTextNode("(none)"));
    } else {
      containingGroups.forEach((g, i) => {
        if (i > 0) groupsLine.appendChild(document.createTextNode(", "));
        const link = document.createElement("a");
        link.href = "#";
        link.textContent = g.name;
        link.addEventListener("click", (e) => { e.preventDefault(); selectObject("groups", g.name); });
        groupsLine.appendChild(link);
      });
    }
    objectPanelBodyEl.appendChild(groupsLine);
  },
  updateLive: () => {
    const particleId = Number(selectedName);
    const p = latestById.get(particleId);
    if (objectPanelInspectEl) {
      objectPanelInspectEl.textContent = p
        ? `position: ${formatVec(p.x, p.y, p.z)}\nvelocity: ${formatVec(p.vx, p.vy, p.vz)}`
