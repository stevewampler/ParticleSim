// re-implementation of the expression grammar, just enough bracket-depth tracking to find the
// three top-level commas (see Wind.velocity's own editing code for why this is safe: the grammar
// only ever produces ValueType.VECTOR from an "[a, b, c]" literal, so any known source is
// guaranteed to already look like this). Returns null for anything that isn't literally that
// shape (no source yet - a native-lambda Wind that's never been edited - or, in principle, a
// vector expression built some other way, e.g. combining two vector literals with `+`) - there's
// no way to show "the X part" of such an expression per-axis, so callers fall back to the live
// value instead.
function splitVectorLiteralSource(source) {
  if (!source) return null;
  const trimmed = source.trim();
  if (!trimmed.startsWith("[") || !trimmed.endsWith("]")) return null;
  const inner = trimmed.slice(1, -1);
  const parts = [];
  let depth = 0, start = 0;
  for (let i = 0; i < inner.length; i++) {
    const ch = inner[i];
    if (ch === "(" || ch === "[") depth++;
    else if (ch === ")" || ch === "]") depth--;
    else if (ch === "," && depth === 0) {
      parts.push(inner.slice(start, i).trim());
      start = i + 1;
    }
  }
  parts.push(inner.slice(start).trim());
  return parts.length === 3 ? parts : null;
}

// Shared by the initial render and every live update: each axis's own input should show its own
// source formula when one is known, falling back to that axis's live value formatted as a plain
// numeric literal otherwise - itself already a valid expression, so editing from there works
// exactly like every axis did before this field had any source at all.
function windVelocityAxisParts(windEntry) {
  return splitVectorLiteralSource(windEntry.velocitySource) ??
    [windEntry.velocity.x, windEntry.velocity.y, windEntry.velocity.z].map((v) => formatSigFigs(v));
}

// Most §10.4 editable-value inputs display the current *evaluated* value, not the original
// formula (see formatVectorExprLiteral's own comment) - so partially editing that text never
// makes sense, only replacing it wholesale does. Without this, a single click into the field
// (not a triple-click or Tab-focus) places the caret wherever the click landed and leaves the
// rest of the old value in place; typing then inserts into/appends to it - clicking at the end of
// a displayed value like "7.4" and typing "0" yields "7.40", parsed as a different number than
// intended rather than an outright error, which is exactly what was reported as "I set velocity
// to [0,0,0] and it kept changing anyway" back when a single combined box held the whole vector
// literal. Applied to the per-axis wind-velocity inputs too even though those show a *formula*,
// not a value (§10.4's per-axis vector-expression editing) - partially editing a formula in place
// can be reasonable, but this project doesn't special-case that field's focus behavior against
// every other expression input's, and nothing has asked for it to. A plain `focus -> input.select()`
// doesn't survive this: the same click's `mouseup` (which fires right after `focus`) places the
// caret and collapses the selection back to a point. Tracking "this mouseup belongs to the click
// that just focused the field" and suppressing its default caret placement is what makes select-
// on-focus actually survive a single click, not just Tab or a triple-click (both of which would
// have passed even without this fix, and are exactly what earlier verification in this project
// used - see TODO.md's follow-up note on this).
function selectAllOnFocus(input) {
  let justFocused = false;
  input.addEventListener("focus", () => {
    justFocused = true;
    input.select();
  });
  input.addEventListener("mouseup", (e) => {
    if (justFocused) {
      e.preventDefault();
      justFocused = false;
    }
  });
  input.addEventListener("blur", () => { justFocused = false; });
}

function renderNameList(container, kind, names) {
  container.innerHTML = "";
  if (names.length === 0) {
    const empty = document.createElement("div");
    empty.className = "outlinerEmpty";
    empty.textContent = "(none)";
    container.appendChild(empty);
    return;
  }
  const list = document.createElement("ul");
  for (const name of names) {
    const item = document.createElement("li");
    item.textContent = name;
    item.dataset.kind = kind;
    item.dataset.name = name;
    item.addEventListener("click", () => selectObject(kind, name));
    list.appendChild(item);
  }
  container.appendChild(list);
}

// --- Self-registering entity-kind UI modules (§10.3) --------------------------------------
// Each entity kind's outliner section + per-object panel body is owned by a module that
// registers itself here via registerEntityKind, rather than being another branch in shared
// dispatch code (renderObjectPanel/updateOutliner) that every other kind's code already lives
// in - a new kind becomes additive instead of a change to code it doesn't own. A module claims
// the outliner section the page's own HTML already declares for its kind (rather than building
// its own container from scratch), so registering is purely additive to what's already on the
// page - section order and header text stay exactly where the page put them.
//
// All six kinds are registered here - "groups" (a toggle, live info text, *and* live inspection),
// "forces" (a per-force arrow-visibility toggle, real only when that force has arrow samples this
// frame, plus editable fields), "constraints" (editable fields only - §10.2 defines no constraint
// renderer), "surfaces" (a mesh-visibility toggle plus live triangle/vertex-speed inspection),
// "colliders" (an active toggle, a remove button, and the collider's shape when active), and
// "particles" (§10.3's one kind with no outliner presence at all - see its own registration
// below for why).
const entityKindModules = new Map(); // kind -> { getNames(registry)?, renderPanel(), updateLive()? }

// getNames is the one optional hook: a kind that omits it (particles - there are potentially
// thousands, and they're never listed per §10.3's own outliner spec) has no outliner section and
// is reachable only via something else (a 3D pick) setting selectedKind/selectedName directly.
// document.getElementById returns null for a kind with no "outliner<Kind>" element in the page
// (particles has none) - harmless, since updateOutliner's render loop only ever touches
// module.sectionEl for a module that actually has getNames.
function registerEntityKind(module) {
  const capitalized = module.kind[0].toUpperCase() + module.kind.slice(1);
  module.sectionEl = document.getElementById("outliner" + capitalized);
  entityKindModules.set(module.kind, module);
}

// Shared per-object-panel building blocks - available to every entity-kind module, so they all
// build their panel bodies the exact same way.
function addPanelNote(text) {
  const note = document.createElement("div");
  note.className = "noRenderer";
  note.textContent = text;
  objectPanelBodyEl.appendChild(note);
}
// invert=true flips the polarity: the checkbox tracks presence *in* `set` directly (checked =
// shown = in the set), the opposite of every other caller's convention (checked = shown = NOT in
// the set, a "hidden" set that starts empty so everything defaults visible). Used for
// shownSurfaceLines, whose default-empty state must mean "hidden" - the one per-object toggle
// here that starts off rather than on.
function addPanelToggle(labelText, set, invert = false) {
  const label = document.createElement("label");
  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.checked = invert ? set.has(selectedName) : !set.has(selectedName);
  checkbox.addEventListener("change", () => {
    const shouldBeInSet = invert ? checkbox.checked : !checkbox.checked;
    if (shouldBeInSet) set.add(selectedName); else set.delete(selectedName);
  });
  label.append(checkbox, document.createTextNode(" " + labelText));
  objectPanelBodyEl.appendChild(label);
}
function addPanelInspect() {
  const inspect = document.createElement("div");
  inspect.className = "objectInspect";
  objectPanelBodyEl.appendChild(inspect);
  objectPanelInspectEl = inspect;
}

// §10.4's numeric field editing. inputsOut/inputsIn map fieldName -> the input element(s) so
// updateEditableFieldsLive can refresh their *displayed* value without recreating them (which
// would sever an in-progress edit) - the panel as a whole is still only rebuilt on selection
// change or a registry signature change, and registrySignature deliberately excludes field
// *values* (only names/booleans) for exactly this reason: a value changing on every edit must
// never itself trigger the rebuild that would clobber the input the user is mid-edit in.
// The inputs store is passed in rather than always written to one shared global so a panel that
// renders more than one named force at once (a group's spring/damper tab) can track each one
// independently instead of the last one clobbering the others - the caller owns resetting it
// (e.g. `= {}`) before the render pass that (re)populates it.
let currentFieldInputs = {};

// §10.4's new "show the current expression source" requirement: a read-only line placed
// alongside an expression-capable field's live-value input (Wind.velocity, an emitter's rate, a
// particle's mass/radius) showing the formula it was last set from - a second line rather than
// replacing the live-value display, since "show the live number at rest" is still the right
// default (requirements.md §10.4's own reasoning: freezing the input at a stale formula while a
// time-varying value keeps moving underneath it would be misleading in its own way). Always
// created (never conditionally appended) and toggled via `hidden` in updateExpressionSourceRow
// instead, so a source that only becomes known *after* the panel is already open (the user's own
// edit just landed) can still appear without needing a full panel rebuild - `renderPanel` only
// re-runs on selection change or a registry *signature* change, which deliberately excludes
// per-field values.
function renderExpressionSourceRow(initialSource) {
  const row = document.createElement("div");
  row.className = "objectInfo";
  row.style.opacity = "0.7";
  row.hidden = !initialSource;
  if (initialSource) row.textContent = "expr: " + initialSource;
  objectPanelBodyEl.appendChild(row);
  return row;
}

function updateExpressionSourceRow(row, source) {
  if (!row) return;
  row.hidden = !source;
  if (source) row.textContent = "expr: " + source;
}

// A particle's mass/radius source is a sparse, id-addressed list (RegistryParticleExpressionEntry
// - see BinaryFrame's own doc comment for why, unlike the emitter/wind lists, it only ever
// carries entries for particles that actually have a known one), so it's looked up by
// (particleId, field) rather than found by name like every other kind here.
function particleExpressionSource(particleId, field) {
  const entry = latestRegistry.particleExpressions.find((e) => e.particleId === particleId && e.field === field);
  return entry ? entry.source : null;
}

function renderEditableFields(kind, name, inputsOut) {
  const fields = latestRegistry.fields.filter((f) => f.kind === kind && f.name === name);
  for (const f of fields) {
    const row = document.createElement("div");
    row.className = "objectField";
    row.appendChild(document.createTextNode(f.field + ": "));
    if (f.value.kind === "scalar") {
      const input = document.createElement("input");
      input.type = "number";
      input.step = "any";
      // An infinite value (e.g. a never-breaks Spring/Damper/MeshSprings break threshold, §5.4)
      // can't be a type="number" input's actual value - the browser silently renders it as an
      // empty box either way, so make that "no limit" reading explicit via a placeholder rather
      // than leaving a blank field indistinguishable from "value 0" or a rendering bug.
      if (Number.isFinite(f.value.value)) {
        input.value = formatSigFigs(f.value.value);
      } else {
        input.value = "";
        input.placeholder = f.value.value > 0 ? "∞ (no limit)" : "-∞";
      }
      selectAllOnFocus(input);
      input.addEventListener("change", () => {
        if (input.value === "") return; // left blank (still infinite) - nothing to send
        sendEdit({ type: "set_scalar_field", kind, name, field: f.field, value: parseFloat(input.value) });
      });
      row.appendChild(input);
      inputsOut[f.field] = { valueKind: "scalar", input };
    } else {
      const inputs = ["x", "y", "z"].map(() => {
        const el = document.createElement("input");
        el.type = "number";
        el.step = "any";
        el.style.width = "4.5em";
        selectAllOnFocus(el);
        return el;
      });
      inputs[0].value = formatSigFigs(f.value.x); inputs[1].value = formatSigFigs(f.value.y); inputs[2].value = formatSigFigs(f.value.z);
      const onChange = () => {
        sendEdit({
          type: "set_vector_field", kind, name, field: f.field,
          x: parseFloat(inputs[0].value), y: parseFloat(inputs[1].value), z: parseFloat(inputs[2].value),
        });
      };
      inputs.forEach((el) => { el.addEventListener("change", onChange); row.appendChild(el); });
      inputsOut[f.field] = { valueKind: "vector", inputs };
    }
    objectPanelBodyEl.appendChild(row);
  }
}

function updateEditableFieldsLive(kind, name, inputsIn) {
  const fields = latestRegistry.fields.filter((f) => f.kind === kind && f.name === name);
  for (const f of fields) {
    const entry = inputsIn[f.field];
    if (!entry) continue;
    if (entry.valueKind === "scalar") {
      if (document.activeElement !== entry.input) {
        entry.input.value = Number.isFinite(f.value.value) ? formatSigFigs(f.value.value) : "";
      }
    } else {
      ["x", "y", "z"].forEach((axis, i) => {
        if (document.activeElement !== entry.inputs[i]) entry.inputs[i].value = formatSigFigs(f.value[axis]);
      });
    }
  }
}

// The groups module's spring/damper tab tracks each qualifying named force's inputs
// independently (see renderEditableFields's own comment on why the store is passed in) - keyed
// by force name, rebuilt alongside the rest of the panel in renderPanel and refreshed in
// updateLive.
let groupForceFieldInputs = {};

registerEntityKind({
  kind: "groups",
  getNames: (registry) => registry.groups.map((g) => g.name),
  renderPanel: () => {
    addPanelToggle("show particles", hiddenGroups);

    // §10.4's group enable/disable - see Groups.isEnabled's own doc comment for what this does
    // and, just as importantly, what it doesn't (structural springs/wind keep acting on a
    // disabled group's members; only field forces/constraints/collision rules that resolve this
    // group by name each step stop).
    const enabledLabel = document.createElement("label");
    const enabledCheckbox = document.createElement("input");
    enabledCheckbox.type = "checkbox";
    enabledCheckbox.checked = latestRegistry.groupEnabled[selectedName] !== false;
    enabledCheckbox.addEventListener("change", (e) => {
      sendEdit({ type: "set_group_enabled", name: selectedName, enabled: e.target.checked });
    });
    enabledLabel.appendChild(enabledCheckbox);
    enabledLabel.appendChild(document.createTextNode(" enabled"));
    objectPanelBodyEl.appendChild(enabledLabel);

    const info = document.createElement("div");
    info.className = "objectInfo";
    info.textContent = groupPanelInfoText(selectedName);
    objectPanelBodyEl.appendChild(info);
    objectPanelInfoEl = info;
    addPanelInspect();

    const forceNames = containedForceNamesForGroup(selectedName);
    groupForceFieldInputs = {};
    if (forceNames.length === 0) {
      addPanelNote("no spring/damper is fully contained within this group (§10.4)");
    } else {
      for (const forceName of forceNames) {
        const label = document.createElement("div");
        label.className = "objectInfo";
        label.textContent = forceName + ":";
        objectPanelBodyEl.appendChild(label);
        groupForceFieldInputs[forceName] = {};
        renderEditableFields("force", forceName, groupForceFieldInputs[forceName]);
      }
    }
  },
  // Refreshes the info/inspect text nodes and every qualifying force's field inputs, never
  // recreating the checkbox/labels they sit next to - called every frame (from updateInspection,
  // itself called from applyFrame) so the "N drawable" count, the live centroid/speed, and each
  // spring/damper's numeric readout all track the current frame without risking a detached
  // checkbox mid-click or clobbering an in-progress edit.
  updateLive: () => {
    if (objectPanelInfoEl) objectPanelInfoEl.textContent = groupPanelInfoText(selectedName);
    if (objectPanelInspectEl) {
      const group = latestRegistry.groups.find((g) => g.name === selectedName);
      const memberIds = group ? group.memberIds : new Set();
      let sumX = 0, sumY = 0, sumZ = 0, sumSpeed = 0, count = 0;
      for (const id of memberIds) {
        const p = latestById.get(id);
        if (!p) continue; // not present this frame (e.g. destroyed - Phase 6, unbuilt, but defensive)
        sumX += p.x; sumY += p.y; sumZ += p.z;
        sumSpeed += vectorLength(p.vx, p.vy, p.vz);
        count++;
      }
      objectPanelInspectEl.textContent = count === 0
        ? "no live data"
        : `centroid: ${formatVec(sumX / count, sumY / count, sumZ / count)}\navg speed: ${formatSigFigs(sumSpeed / count)} m/s`;
    }
    for (const forceName of Object.keys(groupForceFieldInputs)) {
      updateEditableFieldsLive("force", forceName, groupForceFieldInputs[forceName]);
    }
  },
});

let windVelocityInputs = null; // [xInput, yInput, zInput] of the open forces panel's Wind.velocity, or null
let windVelocityValueRow = null; // its companion read-only live-value row, or null

// Reassembles the three axis inputs' current text into one "[x, y, z]" vector-literal string and
// sends it through the same set_wind_velocity/ExpressionParser.parseVector path a single combined
// box used before - each axis is independently a full scalar expression, so nothing server-side
// needed to change for this to work. Skips sending if any axis is left blank, same as leaving a
// plain scalar field blank elsewhere in this panel - a blank axis isn't a valid expression and
// would just be silently rejected server-side anyway.
function sendWindVelocityEdit() {
  if (!windVelocityInputs) return;
  const [x, y, z] = windVelocityInputs.map((el) => el.value.trim());
  if (!x || !y || !z) return;
  sendEdit({ type: "set_wind_velocity", name: selectedName, expression: `[${x}, ${y}, ${z}]` });
}

registerEntityKind({
  kind: "forces",
  getNames: (registry) => registry.forces,
  // A visibility toggle is only real when this force actually has arrow samples this frame
  // (latestArrowGroups, populated in applyFrame) - a force with no arrow renderer (e.g. plain
  // uniform gravity) has nothing here to show or hide, so it keeps the same informational note
  // as before rather than a checkbox that would silently do nothing.
  renderPanel: () => {
    const hasArrows = latestArrowGroups.some((g) => g.name === selectedName);
    if (hasArrows) addPanelToggle("show arrows", hiddenForces);
    currentFieldInputs = {};
    renderEditableFields("force", selectedName, currentFieldInputs);

    // §10.4's Wind.velocity editing: only present when this force is actually a named Wind
    // (latestRegistry.winds has an entry for it) - density keeps going through the ordinary
    // renderEditableFields call above, unaffected. Three plain text inputs, one per axis, each
    // parsed server-side as its own scalar expression rather than one combined box holding a
    // whole "[x, y, z]" literal - each shows *that axis's own source formula*
    // (windVelocityAxisParts), not the live value, since the formula is what you're actually
    // editing; the live evaluated vector moved to a read-only row below instead (unchanged
    // formatVectorExprLiteral formatting, just relabeled from "the editable box" to "an
    // informational readout").
    const windEntry = latestRegistry.winds.find((w) => w.name === selectedName);
    if (windEntry) {
      const velocityLabel = document.createElement("div");
      velocityLabel.className = "objectField";
      velocityLabel.appendChild(document.createTextNode("velocity:"));
      objectPanelBodyEl.appendChild(velocityLabel);

      const parts = windVelocityAxisParts(windEntry);
      windVelocityInputs = ["x", "y", "z"].map((axis, i) => {
        const row = document.createElement("div");
        row.className = "objectField";
        row.appendChild(document.createTextNode("  " + axis + ": "));
        const input = document.createElement("input");
        input.type = "text";
        input.style.width = "11em";
        input.value = parts[i];
        selectAllOnFocus(input);
        input.addEventListener("change", sendWindVelocityEdit);
        row.appendChild(input);
        objectPanelBodyEl.appendChild(row);
        return input;
      });

      windVelocityValueRow = document.createElement("div");
      windVelocityValueRow.className = "objectInfo";
      windVelocityValueRow.textContent = "value: " + formatVectorExprLiteral(windEntry.velocity.x, windEntry.velocity.y, windEntry.velocity.z);
      objectPanelBodyEl.appendChild(windVelocityValueRow);
    } else {
      windVelocityInputs = null;
      windVelocityValueRow = null;
    }

    if (!hasArrows && !windEntry && latestRegistry.fields.every((f) => !(f.kind === "force" && f.name === selectedName))) {
      addPanelNote("no arrow renderer or editable numeric fields for this force yet (§10.2/§10.4)");
    }
  },
  updateLive: () => {
    updateEditableFieldsLive("force", selectedName, currentFieldInputs);
    const windEntry = latestRegistry.winds.find((w) => w.name === selectedName);
    if (windEntry && windVelocityInputs) {
      const parts = windVelocityAxisParts(windEntry);
      // Per-axis, not "any of the three active" - editing x shouldn't freeze a still-live y/z,
      // the same granularity the generic vector-field live-update (updateEditableFieldsLive)
      // already uses for its own x/y/z inputs.
      windVelocityInputs.forEach((el, i) => {
        if (document.activeElement !== el) el.value = parts[i];
      });
    }
    if (windVelocityValueRow && windEntry) {
      windVelocityValueRow.textContent = "value: " + formatVectorExprLiteral(windEntry.velocity.x, windEntry.velocity.y, windEntry.velocity.z);
    }
  },
});

registerEntityKind({
  kind: "constraints",
  getNames: (registry) => registry.constraints,
  // §10.2 defines no constraint renderer at all - editable fields are the only panel content.
  renderPanel: () => {
    currentFieldInputs = {};
    renderEditableFields("constraint", selectedName, currentFieldInputs);
    if (latestRegistry.fields.every((f) => !(f.kind === "constraint" && f.name === selectedName))) {
      addPanelNote("no renderer or editable numeric fields for this constraint yet (§10.2/§10.4)");
    }
  },
  updateLive: () => updateEditableFieldsLive("constraint", selectedName, currentFieldInputs),
});

registerEntityKind({
  kind: "surfaces",
  getNames: (registry) => registry.surfaces,
  renderPanel: () => {
    addPanelToggle("show mesh", hiddenSurfaces);
    // Only offered when this surface actually owns a connection this frame (see applyFrame's
    // surfaceEdgeOwner) - same "don't offer a toggle that would do nothing" precedent the forces
    // panel's "show arrows" toggle already sets for hasArrows.
    if (latestSurfaceLineOwners.has(selectedName)) addPanelToggle("show polylines", shownSurfaceLines, true);

    // §10.4's mesh render-style toggle (shaded vs. wireframe) - viewer-local (see
    // surfaceWireframeOverride's own doc comment on why this never crosses the wire). Checked
    // reflects the *effective* style for this surface right now: an explicit override if one
    // exists, else the server-authored meshDecl.wireframe default for this frame.
    const meshDecl = latestMeshes.find((m) => m.name === selectedName);
    const wireframeLabel = document.createElement("label");
    const wireframeCheckbox = document.createElement("input");
    wireframeCheckbox.type = "checkbox";
    wireframeCheckbox.checked = surfaceWireframeOverride.has(selectedName)
      ? surfaceWireframeOverride.get(selectedName)
      : (meshDecl ? meshDecl.wireframe : false);
    wireframeCheckbox.addEventListener("change", (e) => {
      surfaceWireframeOverride.set(selectedName, e.target.checked);
    });
    wireframeLabel.append(wireframeCheckbox, document.createTextNode(" wireframe"));
    objectPanelBodyEl.appendChild(wireframeLabel);

    addPanelInspect();
  },
  updateLive: () => {
    if (!objectPanelInspectEl) return;
    const meshDecl = latestMeshes.find((m) => m.name === selectedName);
    if (!meshDecl) { objectPanelInspectEl.textContent = "no live data"; return; }
    const vertexIds = new Set();
    for (const tri of meshDecl.triangles) { vertexIds.add(tri.a); vertexIds.add(tri.b); vertexIds.add(tri.c); }
    let sumSpeed = 0, count = 0;
    for (const id of vertexIds) {
      const p = latestById.get(id);
      if (!p) continue;
      sumSpeed += vectorLength(p.vx, p.vy, p.vz);
      count++;
    }
    objectPanelInspectEl.textContent = count === 0
      ? "no live data"
      : `${meshDecl.triangles.length} triangle(s)\navg vertex speed: ${formatSigFigs(sumSpeed / count)} m/s\n` +
        "(this surface's vertices are shown as dots while selected, even if normally mesh-only)";
  },
});

registerEntityKind({
  kind: "colliders",
  getNames: (registry) => registry.colliders.map((c) => c.name),
  renderPanel: () => {
    const collider = latestColliders.find((c) => c.name === selectedName);
    const registryEntry = latestRegistry.colliders.find((c) => c.name === selectedName);
    const info = document.createElement("div");
    info.className = "objectInfo";
    // `collider` (the wireframe/geometry entry) is undefined while inactive - see
    // updateColliders' own doc comment on why that list is filtered - so its shape ("plane"
    // etc.) just isn't shown for a deactivated collider rather than being tracked separately.
    info.textContent = collider ? collider.kind : "(inactive)";
    objectPanelBodyEl.appendChild(info);

    // §10.4's activation toggle: fully inert and hidden while unchecked, same convention as a
    // group's own enable/disable checkbox above.
    const activeLabel = document.createElement("label");
    const activeCheckbox = document.createElement("input");
    activeCheckbox.type = "checkbox";
    activeCheckbox.checked = registryEntry ? registryEntry.active : true;
    activeCheckbox.addEventListener("change", (e) => {
      sendEdit({ type: "set_collider_active", name: selectedName, active: e.target.checked });
    });
    activeLabel.appendChild(activeCheckbox);
    activeLabel.appendChild(document.createTextNode(" active"));
    objectPanelBodyEl.appendChild(activeLabel);

    const removeBtn = document.createElement("button");
    removeBtn.textContent = "remove";
    removeBtn.addEventListener("click", () => {
      send({ type: "remove_collider", name: selectedName });
      // Don't wait for the next frame's collider list to confirm it - close the panel now,
      // same "assume the click worked" immediacy as every other button on this page.
      selectedKind = null;
      selectedName = null;
      updateSelectionHighlight();
      renderObjectPanel();
    });
    objectPanelBodyEl.appendChild(removeBtn);
  },
});

// §10.4's emitter panel. `rate`/`maxAlive`/`evictOldest` all read from latestRegistry.emitters
// directly (recomputed fresh every frame server-side, same as latestRegistry.fields) rather than
// a separate cached list - there's no wireframe-style "geometry vs. registry" split here, an
// emitter has nothing else to fetch.
let emitterFieldInputs = null; // { rateInput, maxAliveInput, evictOldestCheckbox } for the open panel, or null
let emitterRateSourceRow = null; // its companion §10.4 expression-source row, or null
registerEntityKind({
  kind: "emitters",
  getNames: (registry) => registry.emitters.map((e) => e.name),
  renderPanel: () => {
    const entry = latestRegistry.emitters.find((e) => e.name === selectedName);

    // §10.4's expression-string editing, same convention as a particle's mass/radius: a plain
    // text input, parsed server-side via ExpressionParser.parseScalar. Shows the live evaluated
    // number; the companion expr row below (§10.4, new requirement) shows the formula it came
    // from, when known. Edits only ever affect particles spawned after the edit - requirements.md
    // §10.4's own "never retroactive" framing for this field.
    const rateRow = document.createElement("div");
    rateRow.className = "objectField";
    rateRow.appendChild(document.createTextNode("rate: "));
    const rateInput = document.createElement("input");
    rateInput.type = "text";
    rateInput.value = entry ? formatSigFigs(entry.rate) : "";
    selectAllOnFocus(rateInput);
    rateInput.addEventListener("change", () => {
      sendEdit({ type: "set_emitter_rate", name: selectedName, expression: rateInput.value });
    });
    rateRow.appendChild(rateInput);
    objectPanelBodyEl.appendChild(rateRow);
    emitterRateSourceRow = renderExpressionSourceRow(entry?.rateSource);

    const maxAliveRow = document.createElement("div");
    maxAliveRow.className = "objectField";
    maxAliveRow.appendChild(document.createTextNode("max alive: "));
    const maxAliveInput = document.createElement("input");
    maxAliveInput.type = "number";
    maxAliveInput.step = "1";
    maxAliveInput.value = entry ? entry.maxAlive : "";
    maxAliveInput.addEventListener("change", () => {
      sendEdit({ type: "set_emitter_max_alive", name: selectedName, maxAlive: parseInt(maxAliveInput.value, 10) });
    });
    maxAliveRow.appendChild(maxAliveInput);
    objectPanelBodyEl.appendChild(maxAliveRow);

    // Two-valued policy (STOP/EVICT_OLDEST), same boolean-toggle convention as collider
    // activation/group enable rather than a select for just two options.
    const evictLabel = document.createElement("label");
    const evictOldestCheckbox = document.createElement("input");
    evictOldestCheckbox.type = "checkbox";
    evictOldestCheckbox.checked = entry ? entry.evictOldest : false;
    evictOldestCheckbox.addEventListener("change", (e) => {
      sendEdit({ type: "set_emitter_cap_policy", name: selectedName, evictOldest: e.target.checked });
    });
    evictLabel.append(evictOldestCheckbox, document.createTextNode(" evict oldest at cap (unchecked: stop spawning)"));
    objectPanelBodyEl.appendChild(evictLabel);

    emitterFieldInputs = { rateInput, maxAliveInput, evictOldestCheckbox };
  },
  updateLive: () => {
    const entry = latestRegistry.emitters.find((e) => e.name === selectedName);
    if (!entry || !emitterFieldInputs) return;
    if (document.activeElement !== emitterFieldInputs.rateInput) emitterFieldInputs.rateInput.value = formatSigFigs(entry.rate);
    if (document.activeElement !== emitterFieldInputs.maxAliveInput) emitterFieldInputs.maxAliveInput.value = entry.maxAlive;
    if (document.activeElement !== emitterFieldInputs.evictOldestCheckbox) emitterFieldInputs.evictOldestCheckbox.checked = entry.evictOldest;
    updateExpressionSourceRow(emitterRateSourceRow, entry.rateSource);
  },
});

// §10.3/§10.4's particle panel - the one kind with no outliner presence (see registerEntityKind's
// own comment). Reached only via a right-click pick in 3D (see the contextmenu handler below),
// which sets selectedKind/selectedName to ("particles", String(particleId)) directly - §10.3's
// literal "right-clicking a rendered object opens its per-object panel directly" read on a dot,
// not the group-opening placeholder this replaced (see TODO.md's own walkthrough of that change).
registerEntityKind({
  kind: "particles",
  renderPanel: () => {
    const particleId = Number(selectedName);
    const p = latestById.get(particleId);

    const idLine = document.createElement("div");
    idLine.className = "objectInfo";
    idLine.textContent = `particle ${particleId}`;
    objectPanelBodyEl.appendChild(idLine);

    addPanelInspect(); // live position/velocity readout, filled in by updateLive below

    // §10.4's expression-string editing (mass/radius design walkthrough): a plain text input,
    // not type="number" - the value sent is parsed server-side via ExpressionParser.parseScalar,
    // so "2.0 + 0.1*sin(t)" is exactly as valid an edit as "5.0". Shows the live evaluated
    // number; the companion expr row below (§10.4, new requirement) shows the formula it came
    // from, when known (most particles never had one - see ParticleStore.massSource's own doc
    // comment).
    const massRow = document.createElement("div");
    massRow.className = "objectField";
    massRow.appendChild(document.createTextNode("mass: "));
    const massInput = document.createElement("input");
    massInput.type = "text";
    massInput.value = p ? formatSigFigs(p.mass) : "";
    selectAllOnFocus(massInput);
    massInput.addEventListener("change", () => {
      sendEdit({ type: "set_particle_scalar_field", particleId, field: "mass", expression: massInput.value });
    });
    massRow.appendChild(massInput);
    objectPanelBodyEl.appendChild(massRow);
    particleMassSourceRow = renderExpressionSourceRow(particleExpressionSource(particleId, "mass"));

    // radius is NaN (never the unset state itself) when this particle has none - rendered as an
    // empty input, never the literal string "NaN"; editing it in is how "a particle with no
    // radius can have one added" (mass/radius design walkthrough) actually happens.
    const radiusRow = document.createElement("div");
    radiusRow.className = "objectField";
    radiusRow.appendChild(document.createTextNode("radius: "));
    const radiusInput = document.createElement("input");
    radiusInput.type = "text";
    radiusInput.value = p && !Number.isNaN(p.radius) ? formatSigFigs(p.radius) : "";
    selectAllOnFocus(radiusInput);
    radiusInput.addEventListener("change", () => {
      sendEdit({ type: "set_particle_scalar_field", particleId, field: "radius", expression: radiusInput.value });
    });
    radiusRow.appendChild(radiusInput);
    objectPanelBodyEl.appendChild(radiusRow);
    particleRadiusSourceRow = renderExpressionSourceRow(particleExpressionSource(particleId, "radius"));
    particleFieldInputs = { massInput, radiusInput };

    // The multi-group selection design: every containing group is listed as a reselectable
    // entry rather than this panel picking (or rendering) just one - clicking a link switches
    // the whole selection over to that group's own panel, the same navigation selectObject
    // already gives every other kind. Ordered smallest-membership-first - the same heuristic
    // the old right-click-opens-the-group behavior used to pick a single winner - so the more
    // specific, more-likely-intended group is listed first without forcing a single choice.
    // A particle in zero groups (previously unreachable at all through that old behavior) just
    // shows "(none)".
    const groupsLine = document.createElement("div");
    groupsLine.className = "objectInfo";
    groupsLine.appendChild(document.createTextNode("groups: "));
    const containingGroups = latestRegistry.groups
      .filter((g) => g.memberIds.has(particleId))
      .sort((a, b) => a.memberIds.size - b.memberIds.size);
    if (containingGroups.length === 0) {
      groupsLine.appendChild(document.createTextNode("(none)"));
    } else {
      containingGroups.forEach((g, i) => {
        if (i > 0) groupsLine.appendChild(document.createTextNode(", "));
        const link = document.createElement("a");
        link.href = "#";
        link.textContent = g.name;
        link.addEventListener("click", (e) => { e.preventDefault(); selectObject("groups", g.name); });
        groupsLine.appendChild(link);
      });
    }
    objectPanelBodyEl.appendChild(groupsLine);
  },
  updateLive: () => {
    const particleId = Number(selectedName);
    const p = latestById.get(particleId);
    if (objectPanelInspectEl) {
      objectPanelInspectEl.textContent = p
        ? `position: ${formatVec(p.x, p.y, p.z)}\nvelocity: ${formatVec(p.vx, p.vy, p.vz)}`
        : "no live data";
    }
    if (particleFieldInputs && p) {
      if (document.activeElement !== particleFieldInputs.massInput) particleFieldInputs.massInput.value = formatSigFigs(p.mass);
      if (document.activeElement !== particleFieldInputs.radiusInput) {
        particleFieldInputs.radiusInput.value = Number.isNaN(p.radius) ? "" : formatSigFigs(p.radius);
      }
    }
    updateExpressionSourceRow(particleMassSourceRow, particleExpressionSource(particleId, "mass"));
    updateExpressionSourceRow(particleRadiusSourceRow, particleExpressionSource(particleId, "radius"));
  },
});

// Updates whichever per-object panel is currently open with this frame's live data - called
// every frame from applyFrame. Every kind is a module now; one without an updateLive hook (e.g.
// "colliders", whose panel only changes on a registry-signature-triggered rebuild) just does
// nothing here.
function updateInspection() {
  const module = entityKindModules.get(selectedKind);
  if (module && module.updateLive) module.updateLive();
}

function renderObjectPanel() {
  // The body is about to be cleared - drop stale references to nodes that won't exist anymore.
  objectPanelInfoEl = null;
  objectPanelInspectEl = null;
  particleFieldInputs = null;
  particleMassSourceRow = null;
  particleRadiusSourceRow = null;
  emitterFieldInputs = null;
  emitterRateSourceRow = null;
  windVelocityInputs = null;
  windVelocityValueRow = null;
  if (selectedKind === null) {
    objectPanelEl.style.display = "none";
    return;
  }
  objectPanelEl.style.display = "block";
  objectPanelTitleEl.textContent = selectedName;
  objectPanelBodyEl.innerHTML = "";

  entityKindModules.get(selectedKind).renderPanel();
  updateInspection(); // populate immediately rather than waiting for the next frame
}

function updateOutliner(registry) {
  latestRegistry = registry;
  const signature = registrySignature(registry);
  if (signature === lastRegistrySignature) return;
  lastRegistrySignature = signature;
  // A module with no getNames (particles - see registerEntityKind's own comment) has no
  // outliner section at all, so there's nothing to render into here; it's reachable only via
  // something (a 3D pick) setting selectedKind/selectedName directly.
  for (const module of entityKindModules.values()) {
    if (module.getNames) renderNameList(module.sectionEl, module.kind, module.getNames(registry));
  }
  // The colliders module's getNames is driven by the registry, not the (active-only) wireframe
  // collider list in updateColliders - a deactivated collider must stay listed here so its own
  // panel can turn it back on.
  if (selectedKind === "colliders" && !registry.colliders.some((c) => c.name === selectedName)) {
    selectedKind = null; // the selected collider was actually removed, not just deactivated
    selectedName = null;
  }
  updateSelectionHighlight();
  renderObjectPanel();
}

let socket = null;

function connect() {
  // Matches DebugRenderer's default WebSocket port; pass a different DebugRenderer(webSocketPort=)
  // and this needs to change too.
  const ws = new WebSocket(`ws://${location.hostname}:8887`);
  ws.binaryType = "arraybuffer";
  socket = ws;
  ws.onopen = () => {
    statusEl.textContent = "connected";
    resetStats();
    resetEventLog();
    lastRegistrySignature = null;
    // A load_scene/restart that missed the socket while it was reconnecting (see send()'s own
    // comment) gets one retry here, now that there's actually a connection to carry it.
    if (pendingSceneMessage) {
      const message = pendingSceneMessage;
      pendingSceneMessage = null;
      send(message);
    }
  };
  ws.onclose = () => { statusEl.textContent = "disconnected — retrying…"; setTimeout(connect, 1000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (event) => {
    const frame = decodeFrame(event.data);
    const cameraTag = cameraMode === "manual" ? " [manual camera]" : "";
    statusEl.textContent = `t=${frame.t.toFixed(3)}  step=${frame.step}  particles=${frame.particles.length}${cameraTag}`;
    applyFrame(frame);
    updateStats(frame);
    updateEventLog(frame);
    clearSelectionIfParticleDestroyed(frame);
    updateOutliner(frame.registry);
    updateScenePicker(frame);
  };
}
connect();

// --- Interactive drag (§9.4) --------------------------------------------------------------
// Picking is resolved entirely here — the engine never needs to know about cameras or screen
// coordinates, only the resulting 3D target position. Raycasts against both the visible dots
// *and* any surface meshes, since a particle with no dot of its own (§10.2: mesh-only
// rendering) still needs to be pickable — hitting a mesh face resolves to whichever of its
// three vertex particles is nearest the hit point. Only meaningful for a live engine attached
// over this WebSocket; a demo that doesn't wire DebugServer's onTextMessage just never
// receives these and nothing happens. Drag messages are still sent as JSON text (a separate,
// low-frequency channel from the binary per-frame stream) — see DragMessage's own doc comment.

const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const dragPlaneHit = new THREE.Vector3();
let draggedParticleId = null;

// Set by send() below when a load_scene/restart misses a not-yet-open socket - resent once by
// connect()'s own onopen handler.
let pendingSceneMessage = null;

function send(message) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify(message));
    return;
  }
  // The socket can be mid-reconnect for well under a second without the "disconnected -
  // retrying…" status text ever catching a user's eye - previously every message sent during
  // that window (including a scene-switch or restart click) was just silently dropped, with the
  // client's own optimistic reset (resetViewerStateForSceneChange) still running regardless, so
  // it looked like the switch worked while the server never heard about it at all. load_scene/
  // restart are exactly the messages a user expects to "stick" even across a momentary
  // disconnect, so those are remembered and retried on reconnect; every other message type
  // (drags, §10.4 field edits, time control) still just drops as before - queuing those too
  // would mean replaying stale input against whatever scene/state exists by the time the
  // connection actually comes back, a worse failure mode than dropping it.
  console.warn("send() dropped a message - socket not open:", message);
  if (message.type === "load_scene" || message.type === "restart") pendingSceneMessage = message;
}

// §10.4's "pause on edit" toggle - purely client-side: pausing is just sending the existing
// TimeControlMessage the play/pause button already sends, before the edit message itself, so
// the edit lands on a stopped simulation instead of racing the next running step. Every §10.4
// edit call site (collider activation, group enable/disable, numeric field changes) should call
// this instead of send() directly - drag/time-control/scene-restart messages are unaffected.
let pauseOnEdit = false;

function sendEdit(message) {
  if (pauseOnEdit && !isPaused) {
    isPaused = true;
    send({ type: "pause" });
    playPauseBtn.textContent = "▶ play";
  }
  send(message);
}

function pointerToNdc(event) {
  pointerNdc.set(
    (event.clientX / window.innerWidth) * 2 - 1,
    -(event.clientY / window.innerHeight) * 2 + 1,
  );
}

// Resolves a raycaster hit (against either a dot or a mesh face) to a (particleId, point) pair.
// For a mesh hit, `hit.face.{a,b,c}` are the *local* vertex indices of the hit triangle, in
// the same a/b/c order buildMeshGeometry recorded into triangleVertexIds for that same
// triangle — so pairing them positionally (not searching for a matching dot object) is exact,
// not a guess, and works even for a vertex that has no dot of its own (§10.2 mesh-only render).
function pickParticle() {
  const hits = raycaster.intersectObjects([...dots.children, ...meshObjects]);
  if (hits.length === 0) return null;
  const hit = hits[0];
  if (hit.object.userData.particleId !== undefined) {
    return { particleId: hit.object.userData.particleId, point: hit.point };
  }
  const vertexIds = hit.object.userData.triangleVertexIds?.[hit.faceIndex];
  if (!vertexIds || !hit.face) return null;
  const posAttr = hit.object.geometry.attributes.position;
  const localIndices = [hit.face.a, hit.face.b, hit.face.c];
  let nearestId = null;
  let nearestDist = Infinity;
  localIndices.forEach((localIndex, i) => {
    const vertex = new THREE.Vector3().fromBufferAttribute(posAttr, localIndex).applyMatrix4(hit.object.matrixWorld);
    const dist = vertex.distanceTo(hit.point);
    if (dist < nearestDist) { nearestDist = dist; nearestId = vertexIds[i]; }
  });
  return nearestId === null ? null : { particleId: nearestId, point: hit.point };
}

renderer.domElement.addEventListener("pointerdown", (event) => {
  pointerToNdc(event);
  raycaster.setFromCamera(pointerNdc, camera);
  const picked = pickParticle();
  if (!picked) return;

  // A drag beats an orbit — stop OrbitControls' own gesture handling for this pointer so it
  // doesn't also start panning the camera while a particle is being dragged.
  event.stopPropagation();

  draggedParticleId = picked.particleId;
  const draggedDot = dots.children.find((d) => d.userData.particleId === draggedParticleId);
  if (draggedDot) draggedDot.material = draggedDotMaterial;

  // Drag plane: through the picked point, facing the camera — the standard way to turn a 2D
  // mouse position into a 3D target without the user having to separately control depth.
  const cameraForward = new THREE.Vector3();
  camera.getWorldDirection(cameraForward);
  dragPlane.setFromNormalAndCoplanarPoint(cameraForward, picked.point);

  send({ type: "drag_start", particleId: draggedParticleId, step: latestStep, x: picked.point.x, y: picked.point.y, z: picked.point.z });
  renderer.domElement.setPointerCapture(event.pointerId);
}, { capture: true });

renderer.domElement.addEventListener("pointermove", (event) => {
  if (draggedParticleId === null) return;
  pointerToNdc(event);
  raycaster.setFromCamera(pointerNdc, camera);
  if (!raycaster.ray.intersectPlane(dragPlane, dragPlaneHit)) return;
  send({ type: "drag_move", step: latestStep, x: dragPlaneHit.x, y: dragPlaneHit.y, z: dragPlaneHit.z });
});

function endDrag(event) {
  if (draggedParticleId === null) return;
  send({ type: "drag_end", step: latestStep });
  draggedParticleId = null;
  renderer.domElement.releasePointerCapture(event.pointerId);
}
renderer.domElement.addEventListener("pointerup", endDrag);
renderer.domElement.addEventListener("pointercancel", endDrag);

// --- Double-click to delete a particle (§14.2's "explicit delete via the viewer, alongside
// interactive dragging") ------------------------------------------------------------------
// A third click gesture alongside drag (single click+move) and right-click (open panel) - a
// deliberate, hard-to-trigger-by-accident action for something irreversible, the same
// reasoning single vs. double click already carries in most desktop UIs. The two quick
// pointerdown/pointerup pairs a dblclick is built from each start and immediately end a
// no-op drag first (harmless - a drag released without ever moving throws with zero velocity,
// per DragConstraint's own doc comment), so this only ever adds a delete on top, never replaces
// the click handling above.
renderer.domElement.addEventListener("dblclick", (event) => {
  pointerToNdc(event);
  raycaster.setFromCamera(pointerNdc, camera);
  const picked = pickParticle();
  if (!picked) return;
  send({ type: "delete_particle", particleId: picked.particleId });
});

// --- Right-click to open a per-object panel (§10.3) ---------------------------------------
// "The fast path for something already visible" - the outliner's click-to-select still works
// regardless, this is just a shortcut for whatever's already on screen. Reuses the same
// raycast targets as drag/pick above, but resolves differently: a mesh hit opens *that* surface's
// panel directly (unambiguous - a mesh belongs to exactly one Surface), while a dot hit opens
// *that particle's own* panel - the literal reading of "right-clicking a rendered object opens
// its per-object panel directly" (a dot is a rendered object), and what the multi-group
// selection design settled on: the particle panel is what you land on, listing every containing
// group as a link back out, not the reverse. A particle in zero groups - unreachable at all
// under this handler's old group-opening behavior - now opens its own panel same as any other.
// A raycast against an ArrowHelper never hits the ArrowHelper itself - it's a plain Object3D
// wrapping a Line and a cone Mesh, neither of which defines its own raycast-target userData, so
// intersectObjects (recursive by default) resolves to one of those children instead. Walking up
// to the nearest ancestor carrying forceName finds the tag applyFrame set on the ArrowHelper
// itself, however many levels of children three.js's own ArrowHelper implementation nests.
function resolveForceName(object) {
  for (let o = object; o; o = o.parent) {
    if (o.userData.forceName !== undefined) return o.userData.forceName;
  }
  return undefined;
}

renderer.domElement.addEventListener("contextmenu", (event) => {
  event.preventDefault(); // this canvas has its own right-click action; never show the browser's menu
  pointerToNdc(event);
  raycaster.setFromCamera(pointerNdc, camera);

  // Solid geometry (dots, mesh) is raycast separately from - and takes precedence over - arrows,
  // rather than one combined intersectObjects sorted purely by distance. A field force's arrows
  // are sampled *at* the surface they act on, so an arrow's shaft origin sits at essentially the
  // same depth as the mesh face right there - which of the two a distance sort picks is numerical
  // noise, not something the user can aim at, and it was silently stealing right-clicks aimed at
  // the surface (reported as "selecting the flag selects the wind instead"). A solid hit is always
  // the more specific target, so arrows are only considered when nothing solid was hit at all.
  const solidHits = raycaster.intersectObjects([...dots.children, ...meshObjects]);
  if (solidHits.length > 0) {
    const hit = solidHits[0];
    if (hit.object.userData.particleId !== undefined) {
      selectObject("particles", String(hit.object.userData.particleId));
      return;
    }
    const surfaceName = hit.object.userData.surfaceName;
    if (surfaceName) selectObject("surfaces", surfaceName); // "" (unnamed) has no panel to open
    return;
  }

  // §10.3's arrow-picking: a field force (wind, etc.) has no single particle to click, so one
  // of its sampled arrows is the only clickable surface it has - right-clicking any one selects
  // the force that produced it, the same "the fast path for something already visible" as a
  // mesh triangle opening its surface's panel above.
  const arrowHits = raycaster.intersectObjects(arrowObjects);
  if (arrowHits.length === 0) return;
  const forceName = resolveForceName(arrowHits[0].object);
  if (forceName) selectObject("forces", forceName); // "" (unnamed) has no panel to open
});

function animate() {
  requestAnimationFrame(animate);
  if (cameraMode === "manual") controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
